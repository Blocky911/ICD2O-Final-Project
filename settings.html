<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tag Royale — Options</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      background-color: #0b0f19 !important; /* Deep arcade blue fallback */
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      /* CUSTOM GAME CURSOR FOR OPTIONS SCREEN */
      cursor: crosshair !important;
    }

    /* Styles the background div to make a retro moving neon grid */
    .bg-grid {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1 !important; /* Keeps it behind all elements */
      pointer-events: none;
      
      /* Creates the cyan neon grid lines */
      background-image: 
        linear-gradient(rgba(0, 210, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 210, 255, 0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      
      /* Adds a deep purple/cyan vignette glow to the edges */
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8), 
                  inset 0 -300px 300px rgba(0, 210, 255, 0.05);
      
      /* Animates the grid lines so they scroll down slowly */
      animation: gridScroll 12s linear infinite;
    }

    @keyframes gridScroll {
      from { background-position: 0 0; }
      to { background-position: 0 50px; }
    }

    /* Safety override: Makes sure your main container doesn't hide the background */
    .settings-container {
      background: transparent !important;
      position: relative;
      z-index: 2;
    }

    /* ================= MOUSE HOVER & INTERACTIVE GLOW STYLING ================= */
    .back-btn, .menu-btn, .slider, .color-picker, .checkbox-container {
      cursor: crosshair !important;
    }

    /* Adds interactive glowing boundaries around setting configurations on hover */
    .settings-row {
      position: relative;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
      border-radius: 6px;
    }
    
    .settings-row:hover {
      background-color: rgba(0, 210, 255, 0.03) !important;
      box-shadow: left 4px solid #ffd700;
    }

    /* Hover updates for text and link elements */
    .back-btn:hover, .group-title:hover {
      color: #ffd700 !important;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }

    /* Pulsing gold glow rings around primary operation buttons */
    .menu-btn:hover {
      border-color: #ffd700 !important;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
    }

    .btn-accept:hover {
      background-color: #ffd700 !important;
      color: #000000 !important;
      box-shadow: 0 0 15px #ffd700 !important;
    }

    /* Custom slider track glow enhancements */
    .slider:hover::-webkit-slider-thumb {
      box-shadow: 0 0 10px #ffd700;
      background: #ffd700;
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>
  <div class="bg-grid"></div>

  <main class="settings-container">

    <nav class="settings-nav">
      <a href="index.html" class="back-btn">← BACK</a>
      <h1 class="settings-title">OPTIONS</h1>
    </nav>

    <div class="settings-layout">

      <section class="settings-panel">

        <div class="settings-group">
          <h2 class="group-title">VOLUME</h2>
          
          <div class="settings-row">
            <label class="row-label" for="master-vol">Master Volume</label>
            <div class="row-control">
              <input type="range" id="master-vol" min="0" max="100" value="80" class="slider">
            </div>
          </div>

          <div class="settings-row">
            <label class="row-label" for="music-vol">Music Volume</label>
            <div class="row-control">
              <input type="range" id="music-vol" min="0" max="100" value="50" class="slider">
            </div>
          </div>

          <div class="settings-row">
            <label class="row-label" for="sfx-vol">Sound Effects</label>
            <div class="row-control">
              <input type="range" id="sfx-vol" min="0" max="100" value="70" class="slider">
            </div>
          </div>
        </div>

        <div class="settings-group">
          <h2 class="group-title">ACCESSIBILITY</h2>

          <div class="settings-row">
            <label class="row-label" for="stamina-color">Stamina Bar Color</label>
            <div class="row-control">
              <input type="color" id="stamina-color" class="color-picker">
            </div>
          </div>

          <div class="settings-row">
            <label class="row-label" for="low-stamina-color">Low Stamina Color</label>
            <div class="row-control">
              <input type="color" id="low-stamina-color" class="color-picker">
            </div>
          </div>

          <div class="settings-row">
            <label class="row-label" for="exhaustion-color">Exhaustion Color</label>
            <div class="row-control">
              <input type="color" id="exhaustion-color" class="color-picker">
            </div>
          </div>
        </div>

        <div class="settings-group">
          <h2 class="group-title">STAT DISPLAYS</h2>

          <div class="settings-row">
            <span class="row-label">Show Score</span>
            <div class="row-control">
              <label class="checkbox-container">
                <input type="checkbox" id="show-score" checked>
                <span class="checkmark"></span>
              </label>
            </div>
          </div>

          <div class="settings-row">
            <span class="row-label">Display Match Timer</span>
            <div class="row-control">
              <label class="checkbox-container">
                <input type="checkbox" id="show-timer" checked>
                <span class="checkmark"></span>
              </label>
            </div>
          </div>

          <div class="settings-row">
            <span class="row-label">Display Equipped Items</span>
            <div class="row-control">
              <label class="checkbox-container">
                <input type="checkbox" id="show-items" checked>
                <span class="checkmark"></span>
              </label>
            </div>
          </div>
        </div>

      </section>

      <aside class="settings-visual">
        <div class="action-box">
          <button type="button" class="menu-btn btn-reset">RESET DEFAULTS</button>
          <button type="button" class="menu-btn btn-accept">ACCEPT</button>
          <button type="button" class="menu-btn btn-cancel">CANCEL</button>
        </div>
      </aside>

    </div>

  </main>
  
  <script src="settings.js"></script>
</body>
</html>
