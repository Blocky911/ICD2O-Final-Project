<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tag Royale — Tag Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  
  <style>
    /* --- CUSTOM MOUSE POINTER HIGHLIGHT --- */
    * {
      cursor: none !important; 
    }

    .cursor-highlight {
      width: 32px;
      height: 32px;
      border: 2px solid #ff0055;
      background: rgba(255, 0, 85, 0.15);
      border-radius: 50%;
      position: fixed;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 0 15px #ff0055, inset 0 0 10px #ff0055;
      transition: transform 0.08s ease-out, background 0.2s, border-color 0.2s;
    }

    .cursor-highlight.clicking {
      transform: translate(-50%, -50%) scale(0.75);
      background: rgba(0, 255, 200, 0.4);
      border-color: #00ffc8;
      box-shadow: 0 0 20px #00ffc8, inset 0 0 10px #00ffc8;
    }

    /* --- OPENING SEQUENCES --- */
    .opening-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0e12;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .opening-text-stage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .opening-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4rem;
      color: #fff;
      letter-spacing: 4px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
    }

    .opening-bar-bg {
      width: 240px;
      height: 6px;
      background: #1b1d24;
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .opening-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #ff5500);
      box-shadow: 0 0 10px #ff0055;
    }

    .animate-progress {
      animation: splashProgress 2s forwards cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Cinematic White Flash Overlay */
    .white-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      z-index: 1001;
      opacity: 0;
      pointer-events: none;
    }

    .white-flash.flash-active {
      animation: flashAnim 0.6s ease-out forwards;
    }

    /* --- INTEGRATED PAGE SHADE TRANSITIONS --- */
    .exit-shade {
      position: fixed;
      top: -100vh;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, #000000, #0d0e12);
      z-index: 2000;
      pointer-events: none;
    }

    .exit-shade.slide-out-active {
      animation: slideDownOut 0.6s cubic-bezier(0.7, 0, 0.3, 1) forwards;
    }

    .exit-shade.slide-in-active {
      top: 0vh;
      animation: slideDownIn 0.6s cubic-bezier(0.7, 0, 0.3, 1) forwards;
    }

    /* --- TEXT COLOR & MIDDLING ALIGNMENT FIXES --- */
    /* Flex alignment perfectly centers the inner elements horizontally & vertically */
    .actions button {
      padding: 0 !important; /* Clears button padding conflicts */
    }

    .actions button a.nav-link {
      text-decoration: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px; /* Space between icons and typography */
      width: 100%;
      height: 100%;
    }

    /* Colors set manually to perfectly reflect the border boxes shown in your picture */
    .btn-primary a.nav-link {
      color: #000000 !important; /* Black font overlaying the solid yellow background */
    }

    .btn-secondary a.nav-link {
      color: #3bc7b2 !important; /* Matches Shop Teal precisely */
    }

    .btn-inventory a.nav-link {
      color: #f73656 !important; /* Matches Inventory Coral Red precisely */
    }

    .btn-tutorial a.nav-link {
      color: #ffaa00 !important; /* Matches How To Play Gold precisely */
    }

    .btn-settings a.nav-link {
      color: #2bd97c !important; /* Matches Settings Green precisely */
    }

    /* --- MENU STAGE INTRO STATES --- */
    .logo-container {
      opacity: 0;
      transform: scale(0.8) translateY(-20px);
      transition: opacity 1s cubic-bezier(0.25, 1, 0.5, 1), transform 1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .hero-sub, .crown-banner, .actions {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    body.stage-logo-reveal .logo-container {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    body.stage-menu-reveal .hero-sub,
    body.stage-menu-reveal .crown-banner,
    body.stage-menu-reveal .actions {
      opacity: 1;
      transform: translateY(0);
    }

    /* Keyframe Animations */
    @keyframes splashProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    @keyframes flashAnim {
      0% { opacity: 0; }
      10% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes slideDownOut {
      0% { top: -100vh; }
      100% { top: 0vh; }
    }

    @keyframes slideDownIn {
      0% { top: 0vh; }
      100% { top: 100vh; }
    }
  </style>
</head>
<body>

  <div class="cursor-highlight" id="customCursor"></div>

  <div class="white-flash" id="flashOverlay"></div>

  <div class="exit-shade" id="exitShade"></div>

  <div class="opening-screen" id="openingScreen">
    <div class="opening-text-stage" id="textStage">
      <div class="opening-title" id="openingText">INITIALIZING MATCH</div>
      <div class="opening-bar-bg" id="loadingBar">
        <div class="opening-bar-fill" id="progressBarFill"></div>
      </div>
    </div>
  </div>

  <div class="scanlines"></div>
  <div class="bg-grid"></div>

  <main class="container">

    <section class="hero">
      <div class="crown-banner">
        <span class="crown-icon">👑</span>
        <span class="tagline">HOLD THE CROWN. RULE THE MATCH.</span>
        <span class="crown-icon">👑</span>
      </div>
      
      <div class="logo-container">
        <img src="images/game_logo.webp" alt="Tag Royale Logo" class="game-logo" />
      </div>

      <p class="hero-sub">1v1 TAG · 2:30 ROUNDS · 10 PTS / SEC</p>
    </section>

    <section class="actions">
      <button class="btn btn-primary"><a href="difficulty.html" class="nav-link">▶ PLAY NOW</a></button>
      <button class="btn btn-secondary"><a href="shop.html" class="nav-link"><span>💸</span> SHOP</a></button>
      <button class="btn btn-ghost btn-inventory"><a href="inventory.html" class="nav-link"><span>🎒</span> INVENTORY</a></button>
      <button class="btn btn-ghost btn-tutorial"><a href="tutorial.html" class="nav-link"><span>📖</span> HOW TO PLAY</a></button>
      <button class="btn btn-ghost btn-settings"><a href="settings.html" class="nav-link"><span>⚙</span> SETTINGS</a></button>
    </section>
  </main>

  <script>
    // 1. MOUSE HIGHLIGHT INTERACTION
    const customCursor = document.getElementById('customCursor');

    document.addEventListener('mousemove', (e) => {
      customCursor.style.left = e.clientX + 'px';
      customCursor.style.top = e.clientY + 'px';
    });

    document.addEventListener('mousedown', () => { customCursor.classList.add('clicking'); });
    document.addEventListener('mouseup', () => { customCursor.classList.remove('clicking'); });


    // 2. TIMED CINEMATIC INTRO & BACK NAVIGATION TRANSITIONS
    const openingScreen = document.getElementById('openingScreen');
    const textStage = document.getElementById('textStage');
    const openingText = document.getElementById('openingText');
    const loadingBar = document.getElementById('loadingBar');
    const progressBarFill = document.getElementById('progressBarFill');
    const flashOverlay = document.getElementById('flashOverlay');
    const exitShade = document.getElementById('exitShade');

    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('introPlayed') === 'true') {
        openingScreen.style.display = 'none';
        document.body.classList.add('stage-logo-reveal', 'stage-menu-reveal');
        exitShade.classList.add('slide-in-active');
      } else {
        progressBarFill.classList.add('animate-progress');

        setTimeout(() => {
          textStage.style.opacity = '0';
          textStage.style.transform = 'scale(0.95)';
        }, 2000);

        setTimeout(() => {
          loadingBar.style.display = 'none'; 
          openingText.innerText = 'BLOCKY STUDIO PRESENTS';
          textStage.style.opacity = '1';
          textStage.style.transform = 'scale(1)';
        }, 2500);

        setTimeout(() => { textStage.style.opacity = '0'; }, 4500);

        setTimeout(() => {
          flashOverlay.classList.add('flash-active');
          openingScreen.style.display = 'none'; 
          document.body.classList.add('stage-logo-reveal');
          sessionStorage.setItem('introPlayed', 'true');
        }, 5000);

        setTimeout(() => { document.body.classList.add('stage-menu-reveal'); }, 6200);
      }
    });


    // 3. OUTBOUND PAGE TRANSITION (SLIDE DOWN SHADE)
    document.addEventListener('click', function(e) {
      const targetLink = e.target.closest('.nav-link');
      if (targetLink) {
        e.preventDefault();
        const targetUrl = targetLink.getAttribute('href');

        if (targetUrl) {
          exitShade.className = 'exit-shade'; 
          void exitShade.offsetWidth; 
          exitShade.classList.add('slide-out-active');

          setTimeout(() => { window.location.href = targetUrl; }, 600);
        }
      }
    });
  </script>
</body>
</html>
