<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag Royale - Inventory</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      background-color: #0b0f19 !important; /* Fallback deep navy background color */
      margin: 0;
      padding: 0;
      overflow-x: hidden;                  /* Suppresses horizontal page shifting/scrolling */
      
      /* CUSTOM GAME CURSOR FOR INVENTORY SCREEN
         Overwrites standard mouse pointer into an arcade reticle crosshair */
      cursor: crosshair !important;
    }

    /* Styles the background div to make a retro moving neon grid */
    .bg-grid {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1 !important; /* Keeps the grid layers rendered underneath all UI elements */
      pointer-events: none;   /* Ensures clicks ignore this background layer and hit the buttons */
      
      /* Procedural Canvas Grid lines: Creates repetitive intersecting cyan neon paths via gradients */
      background-image: 
        linear-gradient(rgba(0, 210, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 210, 255, 0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      
      /* Adds a deep purple/cyan vignette glow casting dark shades into borders */
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8), 
                  inset 0 -300px 300px rgba(0, 210, 255, 0.05);
      
      /* Runs a slow infinite loop moving the grid along a vertical path */
      animation: gridScroll 12s linear infinite;
    }

    /* Logic for the scrolling background: shifts layout starting coordinates downward by 50px */
    @keyframes gridScroll {
      from { background-position: 0 0; }
      to { background-position: 0 50px; }
    }

    /* Safety override: Prevents opacity or styling parameters on the core container 
       from blinding or breaking visibility of the retro background grid */
    .inventory-container {
      background: transparent !important;
      position: relative;
      z-index: 2;
    }

    /* ================= MOUSE HOVER & IMAGE/TITLE RING STYLING ================= */
    /* Forces the custom crosshair reticle onto standard buttons and items */
    .back-btn, .hotbar-slot, #inventory-action-btn {
      cursor: crosshair !important;
    }

    /* Establishes localized coordinate maps so absolute pseudo-elements (::after rings) 
       snap precisely around these wrappers */
    .big-item-visual, .hotbar-slot, .scroll-grid > div {
      position: relative;
    }

    /* Large selected item display layout properties */
    .preview-art-sprite {
      position: relative;
      transition: transform 0.2s ease; /* Smooth enlargement window */
    }
    
    /* Pop-up scaling effect when hovering cursor over the current inspected element */
    .big-item-visual:hover .preview-art-sprite {
      transform: scale(1.05);
    }
    
    /* GENERATES THE ANIMATED RING ON HOVER:
       Injects a rotating dashed golden target circle behind the sprite image */
    .big-item-visual:hover .preview-art-sprite::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110%;
      height: 110%;
      border: 3px dashed #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 15px #ffd700;
      animation: spinRing 4s linear infinite; /* Constantly rotates the dashed border line */
      pointer-events: none;
    }

    /* Dynamic text color swap for preview header labels on card hover actions */
    .preview-title {
      position: relative;
      display: inline-block;
      transition: color 0.2s ease;
    }
    .big-item-visual:hover .preview-title {
      color: #ffd700 !important; /* Highlights title text gold */
    }

    /* Glowing borders generated around quick use inventory hotbar item slots */
    .hotbar-slot:hover::after {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border: 2px solid #ffd700;
      border-radius: 8px;
      box-shadow: 0 0 12px #ffd700;
      pointer-events: none;
    }

    /* Handles angular rotations from 0 to 360 degrees for the inspected hover rings */
    @keyframes spinRing {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Interactive text lighting for back / shop navigation shortcuts */
    .back-btn:hover {
      color: #ffd700 !important;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }

    /* Glow highlights for action buttons when they are interactive (:not(:disabled)) */
    #inventory-action-btn:not(:disabled):hover {
      background-color: #ffd700 !important;
      color: #000000 !important;
      box-shadow: 0 0 15px #ffd700;
    }

    /* Styling rules that attach to programmatically constructed grid items generated by JavaScript */
    #items-scroll-grid div:hover {
      border-color: #ffd700 !important;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>
  <div class="bg-grid"></div>

  <div class="inventory-container">
    
    <header class="inventory-nav">
      <a href="index.html" class="back-btn">back</a>
      <h1 class="inventory-title">INVENTORY</h1>
      <a href="shop.html" class="back-btn">shop</a>
    </header>

    <main class="inventory-layout">
      
      <div class="grid-container">
        <div id="items-scroll-grid" class="scroll-grid"></div>
      </div>

      <div class="preview-panel">
        <div class="big-item-visual">
          <div id="preview-art" class="preview-art-sprite"></div>
          <h2 id="preview-title" class="preview-title">Select An Item</h2>
        </div>
        
        <div class="description-box">
          <p id="preview-desc">Click on any item in your grid to see details, quantities, or equip options.</p>
          <div id="preview-stats" class="preview-stats"></div>
          <button id="inventory-action-btn" class="action-btn-disabled" disabled>SELECT AN ITEM</button>
        </div>
      </div>

    </main>

    <footer class="hotbar-container">
      <h3 class="hotbar-title">QUICK ACCESS HOTBAR</h3>
      <div class="hotbar-slots">
        <div class="hotbar-slot" data-slot="0"></div>
        <div class="hotbar-slot" data-slot="1"></div>
        <div class="hotbar-slot" data-slot="2"></div>
        <div class="hotbar-slot" data-slot="3"></div>
        <div class="hotbar-slot" data-slot="4"></div>
      </div>
    </footer>

  </div>

  <script src="inventory.js"></script>
  <script src="inventorymusic.js"></script>
</body>
</html>
