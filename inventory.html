<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tag Royale — Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <style>
    /* ── Global Configurations & Base Theme Setup (Bypassing styles.css) ── */
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0c0c0c;
      overflow-x: hidden;
    }

    :root {
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --border: rgba(255, 255, 255, 0.15);
      --surface: rgba(20, 20, 20, 0.8);
      --text: #ffffff;
      --text-muted: #8a8a8a;
      --gold: #d4af37;
      --gold-dim: #aa8c2c;
    }

    body {
      font-family: var(--font-body);
      color: var(--text);
    }

    /* Ambient Background Visuals */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      );
      background-size: 100% 4px;
    }

    /* ── Main Layout Outlines ── */
    .inventory-outer {
      position: relative;
      z-index: 2;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .inventory-main-title {
      font-family: var(--font-display);
      font-size: 2rem;
      letter-spacing: 0.12em;
      color: #fff;
      margin: 0;
      text-transform: uppercase;
    }

    .inventory-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Navbar Header Navigation */
    .inv-nav {
      display: flex;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .inv-nav-btn {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-decoration: none;
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 0.35rem 1.2rem;
      border-radius: 2px;
      transition: color 0.15s, border-color 0.15s;
    }

    .inv-nav-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Main Flex Split Window Content */
    .inv-content {
      display: flex;
      gap: 2rem;
      align-items: stretch;
    }

    /* Left-Side Custom Slots Wrapper Grid Layout */
    .inv-grid-wrapper {
      flex: 1;
      display: flex;
      gap: 1rem;
    }

    .inv-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    /* Custom Webkit scrollbar trackers styling */
    .inv-grid::-webkit-scrollbar {
      width: 4px;
    }
    .inv-grid::-webkit-scrollbar-track {
      background: transparent;
    }
    .inv-grid::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }
    .inv-grid::-webkit-scrollbar-thumb:hover {
      background: var(--gold-dim);
    }

    /* Individual Inventory Slots */
    .inv-slot {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 2px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      gap: 0.5rem;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, border-color 0.15s;
    }

    .inv-slot:hover:not(.empty) {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .inv-slot.active {
      border-color: var(--gold);
      background: rgba(212, 175, 55, 0.05);
    }

    .inv-slot.empty {
      cursor: default;
      opacity: 0.4;
      background: rgba(0, 0, 0, 0.15);
    }

    .slot-name {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
      font-weight: 500;
      pointer-events: none;
    }

    .inv-slot.active .slot-name {
      color: var(--gold);
    }

    /* Right Sidebar Inspect Showcase Panels Elements */
    .inv-inspect {
      width: 280px;
      border-left: 1px solid var(--border);
      padding-left: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .inspect-visual-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 2px;
      aspect-ratio: 4 / 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      position: relative;
    }

    .inspect-visual-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(to top right, transparent calc(50% - 1px), var(--border), transparent calc(50% + 1px)),
        linear-gradient(to top left, transparent calc(50% - 1px), var(--border), transparent calc(50% + 1px));
      opacity: 0.25;
      pointer-events: none;
    }

    .inspect-title-tag {
      font-family: var(--font-display);
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      color: #fff;
      text-transform: uppercase;
    }

    .inspect-desc-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 1rem;
    }

    .desc-text {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text-muted);
    }

    /* Decorative Accent Track Bar styling adjustments */
    .inv-scroll-accent {
      width: 4px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 2px;
      position: relative;
    }
    .accent-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 25%;
      background: var(--border);
      border-radius: 2px;
    }


    /* ==========================================================================
       SPRITESHEET LOGIC PROCESSING (images/item_spritesheet.png)
       ========================================================================== */
    .sprite-art {
      width: 48px;
      height: 48px;
      background-image: url('images/item_spritesheet.png');
      background-repeat: no-repeat;
      background-size: 144px 144px; /* Uniform 3x3 layout scale coordinates */
      
      /* Pure Crisp Pixels configuration */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      pointer-events: none;
    }

    /* Grid Slot Coordinate Matrix Slices */
    .sprite-art.bar        { background-position: 0px 0px; }
    .sprite-art.tomato     { background-position: -48px 0px; }
    .sprite-art.bear       { background-position: -96px 0px; }
    .sprite-art.fart-bomb  { background-position: -96px -48px; }
    .sprite-art.potion     { background-position: 0px -96px; }

    /* Enlarged Inspector Display Slices (Twice structural size: 96px x 96px) */
    .sprite-inspect {
      width: 96px;
      height: 96px;
      background-image: url('images/item_spritesheet.png');
      background-repeat: no-repeat;
      background-size: 288px 288px; /* Multiplied standard base scale grid sizes by 2 */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .sprite-inspect.bar        { background-position: 0px 0px; }
    .sprite-inspect.tomato     { background-position: -96px 0px; }
    .sprite-inspect.bear       { background-position: -192px 0px; }
    .sprite-inspect.fart-bomb  { background-position: -192px -96px; }
    .sprite-inspect.potion     { background-position: 0px -192px; }
  </style>
</head>
<body>

  <div class="scanlines"></div>
  <div class="bg-grid"></div>

  <main class="inventory-outer">
    <h1 class="inventory-main-title">Inventory</h1>

    <div class="inventory-container">
      
      <header class="inv-nav">
        <a href="index.html" class="inv-nav-btn">back</a>
        <a href="shop.html" class="inv-nav-btn">shop</a>
      </header>

      <div class="inv-content">
        
        <div class="inv-grid-wrapper">
          <div class="inv-grid">
            
            <div class="inv-slot active" data-item="energy">
              <div class="sprite-art bar"></div>
              <span class="slot-name">Energy Bar</span>
            </div>

            <div class="inv-slot" data-item="tomatoes">
              <div class="sprite-art tomato"></div>
              <span class="slot-name">Rotten Tomatoes</span>
            </div>

            <div class="inv-slot" data-item="gummy">
              <div class="sprite-art bear"></div>
              <span class="slot-name">Gummy Bears</span>
            </div>

            <div class="inv-slot" data-item="fart">
              <div class="sprite-art fart-bomb"></div>
              <span class="slot-name">Fart Bomb</span>
            </div>

            <div class="inv-slot" data-item="potion">
              <div class="sprite-art potion"></div>
              <span class="slot-name">Untaggable Potion</span>
            </div>

            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>
            <div class="inv-slot empty"></div>

          </div>
          
          <div class="inv-scroll-accent">
            <div class="accent-thumb"></div>
          </div>
        </div>

        <aside class="inv-inspect">
          
          <div class="inspect-visual-box">
            <div id="inspect-art" class="sprite-inspect bar"></div>
            <div id="inspect-title" class="inspect-title-tag">Energy Bar</div>
          </div>

          <div class="inspect-desc-box">
            <p id="inspect-desc" class="desc-text">
              Provides a critical quick burst of stamina, immediately restoring your active sprint reserves to keep you moving at top speed.
            </p>
          </div>

        </aside>

      </div>
    </div>
  </main>

  <script>
    const itemData = {
      energy: {
        title: "Energy Bar",
        spriteClass: "bar",
        desc: "Provides a critical quick burst of stamina, immediately restoring your active sprint reserves to keep you moving at top speed."
      },
      tomatoes: {
        title: "Rotten Tomatoes",
        spriteClass: "tomato",
        desc: "A messy projectile that slows down enemy runner bots or active taggers upon impact, swinging momentum back to you."
      },
      gummy: {
        title: "Gummy Bears",
        spriteClass: "bear",
        desc: "A delicious, colorful treat that steadily replenishes health points and staves off complete exhaustion in high-intensity runs."
      },
      fart: {
        title: "Fart Bomb",
        spriteClass: "fart-bomb",
        desc: "Releases a hazardous visual blast cloud that knocks nearby tag challengers backwards, buying valuable escape seconds."
      },
      potion: {
        title: "Untaggable Potion",
        spriteClass: "potion",
        desc: "An exotic glowing formula giving full cosmetic shielding aura properties, making you totally untaggable for a short span."
      }
    };

    const slots = document.querySelectorAll('.inv-slot:not(.empty)');
    const inspectArt = document.getElementById('inspect-art');
    const inspectTitle = document.getElementById('inspect-title');
    const inspectDesc = document.getElementById('inspect-desc');

    slots.forEach(slot => {
      slot.addEventListener('click', () => {
        // Remove active outline class from old items
        slots.forEach(s => s.classList.remove('active'));
        
        // Target requested item data definitions
        slot.classList.add('active');
        const itemId = slot.getAttribute('data-item');
        const item = itemData[itemId];
        
        if (item) {
          // Sync inspector displays
          inspectTitle.textContent = item.title;
          inspectDesc.textContent = item.desc;
          
          // Re-class item display offset coordinates
          inspectArt.className = `sprite-inspect ${item.spriteClass}`;
        }
      });
    });
  </script>
</body>
</html>
