<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag Royale - My Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg-grid"></div>

  <div class="inventory-container">
    
    <header class="inventory-nav">
      <a href="index.html" class="back-btn">← BACK</a>
      <h1 class="inventory-title">MY GEAR</h1>
      <div class="balance-display">
        🪙 <span id="player-coins">100</span>
      </div>
    </header>

    <main class="inventory-content">
      
      <div class="inventory-section">
        <h2 class="sub-heading">Supplies</h2>
        <ul class="supplies-list">
          <li><span>Energy Bar</span> <strong id="inv-energy_bar">x0</strong></li>
          <li><span>Rotten Tomatoes</span> <strong id="inv-tomatoes">x0</strong></li>
          <li><span>Gummy Bears</span> <strong id="inv-gummy_bears">x0</strong></li>
          <li><span>Fart Bomb</span> <strong id="inv-fart_bomb">x0</strong></li>
          <li><span>Untagable Potion</span> <strong id="inv-potion">x0</strong></li>
        </ul>
      </div>

      <div class="inventory-section">
        <h2 class="sub-heading">Character Outfits</h2>
        <div class="skin-vault">
          
          <div class="vault-slot">
            <span class="slot-art">🔴</span>
            <button class="buy-btn" onclick="buyItem('skin_default_red', 0)">Loading...</button>
          </div>

          <div class="vault-slot">
            <span class="slot-art">🍗</span>
            <button class="buy-btn" onclick="buyItem('skin_nugget', 15)">Loading...</button>
          </div>

          <div class="vault-slot">
            <span class="slot-art">🐒</span>
            <button class="buy-btn" onclick="buyItem('skin_george', 25)">Loading...</button>
          </div>

          <div class="vault-slot">
            <span class="slot-art">🐷</span>
            <button class="buy-btn" onclick="buyItem('skin_john', 50)">Loading...</button>
          </div>

        </div>
      </div>

      <div class="inventory-section">
        <h2 class="sub-heading">Bot Models</h2>
        <div class="skin-vault">
          
          <div class="vault-slot">
            <span class="slot-art">🔵</span>
            <button class="buy-btn" onclick="buyItem('bot_default_blue', 0)">Loading...</button>
          </div>

          <div class="vault-slot">
            <span class="slot-art">🦝</span>
            <button class="buy-btn" onclick="buyItem('bot_stealer', 15)">Loading...</button>
          </div>

          <div class="vault-slot">
            <span class="slot-art">👨‍🏫</span>
            <button class="buy-btn" onclick="buyItem('bot_mcrae', 30)">Loading...</button>
          </div>

          <div class="vault-slot">
            <span class="slot-art">😈</span>
            <button class="buy-btn" onclick="buyItem('bot_evil', 45)">Loading...</button>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script src="inventory.js"></script>
</body>
</html>
