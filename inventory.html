<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag Royale - Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      background-color: #0b0f19 !important; /* Deep arcade blue fallback */
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      /* CUSTOM GAME CURSOR FOR INVENTORY SCREEN */
      cursor: crosshair !important;
    }

    /* Styles the background div to make a retro moving neon grid */
    .bg-grid {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1 !important; /* Keeps it behind all elements */
      pointer-events: none;
      
      /* Creates the cyan neon grid lines */
      background-image: 
        linear-gradient(rgba(0, 210, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 210, 255, 0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      
      /* Adds a deep purple/cyan vignette glow to the edges */
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8), 
                  inset 0 -300px 300px rgba(0, 210, 255, 0.05);
      
      /* Animates the grid lines so they scroll down slowly */
      animation: gridScroll 12s linear infinite;
    }

    @keyframes gridScroll {
      from { background-position: 0 0; }
      to { background-position: 0 50px; }
    }

    /* Safety override: Makes sure your main container doesn't hide the background */
    .inventory-container {
      background: transparent !important;
      position: relative;
      z-index: 2;
    }

    /* ================= MOUSE HOVER & IMAGE/TITLE RING STYLING ================= */
    .back-btn, .hotbar-slot, #inventory-action-btn {
      cursor: crosshair !important;
    }

    /* Position visual anchors inside panels for the absolute pseudo rings */
    .big-item-visual, .hotbar-slot, .scroll-grid > div {
      position: relative;
    }

    /* Ring around the Large Preview Sprite Image on Hover */
    .preview-art-sprite {
      position: relative;
      transition: transform 0.2s ease;
    }
    .big-item-visual:hover .preview-art-sprite {
      transform: scale(1.05);
    }
    .big-item-visual:hover .preview-art-sprite::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110%;
      height: 110%;
      border: 3px dashed #ffd700;
      border-radius: 50%;
      box-shadow: 0 0 15px #ffd700;
      animation: spinRing 4s linear infinite;
      pointer-events: none;
    }

    /* Ring around the Large Preview Title Header text on Hover */
    .preview-title {
      position: relative;
      display: inline-block;
      transition: color 0.2s ease;
    }
    .big-item-visual:hover .preview-title {
      color: #ffd700 !important;
    }

    /* Rings around the Hotbar quick access slots */
    .hotbar-slot:hover::after {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border: 2px solid #ffd700;
      border-radius: 8px;
      box-shadow: 0 0 12px #ffd700;
      pointer-events: none;
    }

    /* Keyframe Animations for active elements */
    @keyframes spinRing {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Hover updates for navigation items */
    .back-btn:hover {
      color: #ffd700 !important;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }

    #inventory-action-btn:not(:disabled):hover {
      background-color: #ffd700 !important;
      color: #000000 !important;
      box-shadow: 0 0 15px #ffd700;
    }

    /* CSS rules targeting dynamic JavaScript item block content injection maps */
    #items-scroll-grid div:hover {
      border-color: #ffd700 !important;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>
  <div class="bg-grid"></div>

  <div class="inventory-container">
    
    <header class="inventory-nav">
      <a href="index.html" class="back-btn">back</a>
      <h1 class="inventory-title">INVENTORY</h1>
      <a href="shop.html" class="back-btn">shop</a>
    </header>

    <main class="inventory-layout">
      
      <div class="grid-container">
        <div id="items-scroll-grid" class="scroll-grid"></div>
      </div>

      <div class="preview-panel">
        <div class="big-item-visual">
          <div id="preview-art" class="preview-art-sprite"></div>
          <h2 id="preview-title" class="preview-title">Select An Item</h2>
        </div>
        
        <div class="description-box">
          <p id="preview-desc">Click on any item in your grid to see details, quantities, or equip options.</p>
          <div id="preview-stats" class="preview-stats"></div>
          <button id="inventory-action-btn" class="action-btn-disabled" disabled>SELECT AN ITEM</button>
        </div>
      </div>

    </main>

    <footer class="hotbar-container">
      <h3 class="hotbar-title">QUICK ACCESS HOTBAR</h3>
      <div class="hotbar-slots">
        <div class="hotbar-slot" data-slot="0"></div>
        <div class="hotbar-slot" data-slot="1"></div>
        <div class="hotbar-slot" data-slot="2"></div>
        <div class="hotbar-slot" data-slot="3"></div>
        <div class="hotbar-slot" data-slot="4"></div>
      </div>
    </footer>

  </div>

  <script src="inventory.js"></script>

  <script>
    let invAudioCtx = null;
    let invMasterVolume = null;
    let invMusicInterval = null;
    let isInvMusicPlaying = false;
    
    let invTempoBpm = 108; // Slower, swinging lounge pacing
    let invStepIndex = 0;

    // Smooth jazz-style chord progression loop (A-minor 7 variants)
    const invBassNotes = [
        110.00, 110.00, 110.00, 146.83,  
        164.81, 164.81, 196.00, 220.00,  
        110.00, 110.00, 130.81, 146.83,  
        164.81, 130.81, 98.00,  87.31    
    ];

    const invMelodyNotes = [
        440.00, 523.25, 587.33, 659.25,  
        392.00, 493.88, 587.33, 783.99,   
        523.25, 659.25, 783.99, 987.77,  
        440.00, 392.00, 349.23, 329.63   
    ];

    function initInventoryAudio() {
      try {
        if (!invAudioCtx) {
          invAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
          
          invMasterVolume = invAudioCtx.createGain();
          invMasterVolume.gain.setValueAtTime(0.05, invAudioCtx.currentTime); 
          invMasterVolume.connect(invAudioCtx.destination);
        }
        if (invAudioCtx.state === 'suspended') {
          invAudioCtx.resume();
        }
      } catch(e) {
        console.error("Inventory audio context failed to initialize:", e);
      }
    }

    function playInventoryStep() {
      if (!invAudioCtx || invAudioCtx.state === 'suspended') return;

      let stepDuration = 60 / invTempoBpm;
      let playTime = invAudioCtx.currentTime + 0.01;

      // 1. Deep Sub-Bass Walking Line
      let bassOsc = invAudioCtx.createOscillator();
      let bassGain = invAudioCtx.createGain();
      let bassFilter = invAudioCtx.createBiquadFilter();

      bassOsc.type = 'sine'; 
      bassOsc.frequency.setValueAtTime(invBassNotes[invStepIndex % 16], playTime);
      bassFilter.type = 'lowpass';
      bassFilter.frequency.setValueAtTime(280, playTime); 

      bassGain.gain.setValueAtTime(0.4, playTime);
      bassGain.gain.exponentialRampToValueAtTime(0.001, playTime + stepDuration - 0.02);

      bassOsc.connect(bassFilter);
      bassFilter.connect(bassGain);
      bassGain.connect(invMasterVolume);
      bassOsc.start(playTime);
      bassOsc.stop(playTime + stepDuration);

      // 2. Chill Rhythmic Synth Melody Counterpoint
      if (invStepIndex % 4 === 0 || invStepIndex % 4 === 3) {
        let melodyOsc = invAudioCtx.createOscillator();
        let melodyGain = invAudioCtx.createGain();
        let melodyFilter = invAudioCtx.createBiquadFilter();

        melodyOsc.type = 'triangle';
        let note = invMelodyNotes[(invStepIndex + 2) % 16];
        melodyOsc.frequency.setValueAtTime(note, playTime);
        melodyFilter.type = 'lowpass';
        melodyFilter.frequency.setValueAtTime(1200, playTime);

        melodyGain.gain.setValueAtTime(0.07, playTime);
        melodyGain.gain.exponentialRampToValueAtTime(0.001, playTime + stepDuration * 1.8);

        melodyOsc.connect(melodyFilter);
        melodyFilter.connect(melodyGain);
        melodyGain.connect(invMasterVolume);
        
        melodyOsc.start(playTime);
        melodyOsc.stop(playTime + stepDuration * 1.8);
      }

      // 3. High-End Shaker Beat
      if (invStepIndex % 2 === 1) {
        let shakeOsc = invAudioCtx.createOscillator();
        let shakeGain = invAudioCtx.createGain();
        
        shakeOsc.type = 'triangle';
        shakeOsc.frequency.setValueAtTime(9500, playTime); 

        shakeGain.gain.setValueAtTime(0.01, playTime);
        shakeGain.gain.exponentialRampToValueAtTime(0.0001, playTime + 0.04);

        shakeOsc.connect(shakeGain);
        shakeGain.connect(invMasterVolume);
        
        shakeOsc.start(playTime);
        shakeOsc.stop(playTime + 0.05);
      }

      invStepIndex = (invStepIndex + 1) % 16;
    }

    function startInventorySoundtrack() {
      initInventoryAudio();
      if (isInvMusicPlaying) return;
      isInvMusicPlaying = true;
      let intervalMs = (60 / invTempoBpm) * 1000;
      invMusicInterval = setInterval(playInventoryStep, intervalMs);
    }

    window.addEventListener('DOMContentLoaded', startInventorySoundtrack);
    window.addEventListener('load', startInventorySoundtrack);
    document.addEventListener('click', startInventorySoundtrack, { once: false });
    document.addEventListener('keydown', startInventorySoundtrack, { once: false });
  </script>
</body>
</html>
