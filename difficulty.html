<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag Royal(e) - Select Difficulty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
  <style>
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      min-width: 260px;
      max-width: 360px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(13, 18, 26, 0.95);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
      pointer-events: auto;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>
  <div class="bg-grid"></div>
  <div id="toast-container" class="toast-container"></div>

  <main class="settings-container">

    <nav class="settings-nav">
      <a href="index.html" class="back-btn">← BACK</a>
      <h1 class="settings-title">SELECT DIFFICULTY</h1>
    </nav>

    <div class="difficulty-layout">
      <section class="settings-panel difficulty-panel">
        <div class="difficulty-grid">
          <div class="diff-card">
            <div class="circle-visual"><span class="placeholder-icon">🟢</span></div>
            <button class="diff-btn easy" onclick="selectDifficulty('easy')">EASY</button>
          </div>
          <div class="diff-card">
            <div class="circle-visual"><span class="placeholder-icon">🟡</span></div>
            <button class="diff-btn medium" onclick="selectDifficulty('medium')">MEDIUM</button>
          </div>
          <div class="diff-card">
            <div class="circle-visual"><span class="placeholder-icon">🔴</span></div>
            <button class="diff-btn hard" onclick="selectDifficulty('hard')">HARD</button>
          </div>
          <div class="diff-card">
            <div class="circle-visual"><span class="placeholder-icon">💀</span></div>
            <button class="diff-btn hard" onclick="selectDifficulty('impossible')">IMPOSSIBLE</button>
          </div>
        </div>
      </section>
    </div>

  </main>

  <script src="difficulty.js"></script>
</body>
</html>
