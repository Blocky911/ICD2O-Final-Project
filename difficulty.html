<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tag Royal(e) - Select Difficulty</title>
  <link rel="stylesheet" href="difficulty.css">
</head>
<body>

  <div class="diff-container">
    
    <header class="diff-header-box">
      <h1 class="diff-title">SELECT DIFFICULTY</h1>
    </header>

    <main class="diff-layout">
      
      <div class="diff-card">
        <div class="circle-visual">
          <div class="placeholder-icon">🟢</div>
        </div>
        <button class="diff-btn easy" onclick="selectDifficulty('easy')">EASY</button>
      </div>

      <div class="diff-card">
        <div class="circle-visual">
          <div class="placeholder-icon">🟡</div>
        </div>
        <button class="diff-btn medium" onclick="selectDifficulty('medium')">MEDIUM</button>
      </div>

      <div class="diff-card">
        <div class="circle-visual">
          <div class="placeholder-icon">🔴</div>
        </div>
        <button class="diff-btn hard" onclick="selectDifficulty('hard')">HARD</button>
      </div>

    </main>

    <footer class="diff-footer">
      <a href="index.html" class="back-btn">← CANCEL</a>
    </footer>

  </div>

  <script src="difficulty.js"></script>
</body>
</html>
