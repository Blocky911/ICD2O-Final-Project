<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Royale - Production Engine</title>
    <style>
        /* ==========================================================
           1. CORE VIEWPORT AND WINDOW ENGINE MANAGEMENT
           ========================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #11141a;
            display: block; 
        }

        /* ==========================================================
           2. WORLD GRAPHICS SURFACE MATRICES
           ========================================================== */
        #main-map {
            width: 5000px;
            height: 5000px;
            position: relative;
            background-color: #4c8c13;
            background-image: 
                radial-gradient(#597327 18%, transparent 19%),
                radial-gradient(#33540a 15%, transparent 16%),
                linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%),
                linear-gradient(45deg, rgba(0,0,0,0.02) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.02) 75%);
            background-size: 80px 80px, 40px 40px, 120px 120px, 120px 120px;
            background-position: 0 0, 20px 20px, 0 0, 60px 60px;
        }

        /* ==========================================================
           3. FIELD ENVIRONMENT AND OBSTACLE TEXTURES
           ========================================================== */
        .border-tree {
            position: absolute;
            width: 130px;
            height: 130px;
            background-image: radial-gradient(circle at 40% 40%, #366623 20%, #224515 60%, #11260a 100%);
            border-radius: 50%;
            box-shadow: 0px 15px 25px rgba(0,0,0,0.55), inset -5px -5px 15px rgba(0,0,0,0.4);
            z-index: 12;
        }

        .map-tree {
            position: absolute;
            width: 150px;
            height: 150px;
            background-image: radial-gradient(circle at 35% 35%, #478c2b 15%, #2a5918 55%, #142e0b 100%);
            border-radius: 50%;
            box-shadow: 0px 22px 30px rgba(0,0,0,0.6), inset -8px -8px 20px rgba(0,0,0,0.5);
            z-index: 12;
        }

        .mud-patch {
            position: absolute;
            background-color: #523713;
            background-image: radial-gradient(#3a250a 25%, transparent 30%);
            background-size: 24px 24px;
            border-radius: 42% 58% 35% 65%;
            opacity: 0.92;
            box-shadow: inset 0px 0px 40px rgba(0,0,0,0.75), 0px 4px 10px rgba(0,0,0,0.15);
            z-index: 2;
        }

        .rock {
            position: absolute;
            background-color: #718093;
            background-image: 
                linear-gradient(45deg, #4b5666 25%, transparent 25%), 
                linear-gradient(-45deg, #3d4654 25%, transparent 25%),
                linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 40%);
            background-size: 40px 40px, 40px 40px, 100% 100%;
            border-radius: 30px;
            border: 6px solid #434e5a;
            box-shadow: 8px 16px 24px rgba(0,0,0,0.4), inset -4px -4px 10px rgba(0,0,0,0.3);
            z-index: 5;
        }

        .cut-hedge {
            position: absolute;
            background-color: #1b3d1d;
            background-image: 
                radial-gradient(#275429 20%, transparent 25%),
                radial-gradient(#143016 15%, transparent 20%),
                linear-gradient(90deg, rgba(0,0,0,0.15) 0%, transparent 10%, transparent 90%, rgba(0,0,0,0.25) 100%);
            background-size: 20px 20px, 14px 14px, 100% 100%;
            border: 7px solid #0a1c0b;
            border-radius: 12px;
            box-shadow: 0px 18px 32px rgba(0,0,0,0.55), inset 0px 0px 25px rgba(0,0,0,0.7);
            z-index: 9;
        }

        /* ==========================================================
           4. EXTENDED & ENLARGED L-SHAPED ARCHITECTURAL RESIDENCE
           ========================================================== */
        .image-house {
            position: absolute;
            left: 2100px;
            top: 1700px;
            width: 1200px;
            height: 1200px;
            z-index: 6;
        }

        .house-drop-shadow {
            position: absolute;
            left: 55px;
            top: -35px;
            width: 950px;
            height: 950px;
            background-color: rgba(0,0,0,0.42);
            filter: blur(16px);
            z-index: 1;
            pointer-events: none;
            clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 50% 50%, 50% 100%, 0% 100%);
        }

        .house-yellow-deck {
            position: absolute;
            left: 50px;
            top: 50px;
            width: 850px;
            height: 850px;
            background-color: #cfc25d;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 18px, rgba(0,0,0,0.06) 18px, rgba(0,0,0,0.06) 21px);
            border: 11px solid #141414;
            z-index: 2;
            clip-path: polygon(0% 0%, 100% 0%, 100% 50%, 50% 50%, 50% 100%, 0% 100%);
            box-shadow: inset 0px 0px 30px rgba(0,0,0,0.2);
        }

        .deck-fixture {
            position: absolute;
            width: 48px;
            height: 64px;
            background-image: linear-gradient(135deg, #cccccc 0%, #999999 100%);
            border: 7px solid #161616;
            border-radius: 6px;
            box-shadow: inset 0px 5px 0px rgba(255,255,255,0.6), 0px 8px 14px rgba(0,0,0,0.3);
            z-index: 3;
        }

        .fx1 { left: 450px; top: 550px; }
        .fx2 { left: 450px; top: 750px; }
        .fx3 { left: 750px; top: 450px; }

        .house-roof-body {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 800px;
            height: 800px;
            background-color: #b87151;
            background-image: 
                linear-gradient(0deg, rgba(0,0,0,0.1) 50%, transparent 50%),
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.04) 10px, rgba(0,0,0,0.04) 13px);
            background-size: 100% 40px, 100% 100%;
            border: 20px solid #181818;
            z-index: 4;
            clip-path: polygon(0% 0%, 100% 0%, 100% 45%, 45% 45%, 45% 100%, 0% 100%);
        }

        .roof-ridge-line {
            position: absolute;
            background-color: #1c1c1c;
            z-index: 5;
        }

        .ridge-long-v  { left: 340px; top: 0px; width: 22px; height: 800px; }
        .ridge-short-h { left: 340px; top: 340px; width: 460px; height: 22px; }

        .ridge-diagonal {
            position: absolute;
            width: 450px;
            height: 22px;
            background-color: #1c1c1c;
            z-index: 5;
            transform-origin: left center;
        }

        .diag1 { left: 0px; top: 0px; transform: rotate(45deg); }
        .diag2 { left: 0px; top: 800px; transform: rotate(-45deg); }
        .diag3 { left: 800px; top: 0px; transform: rotate(135deg); }
        .diag4 { left: 350px; top: 350px; transform: rotate(45deg); width: 630px; }

        /* ==========================================================
           5. AQUATIC FLOTATION ELEMENTS
           ========================================================== */
        .pool {
            position: absolute;
            left: 1400px;
            top: 2500px;
            width: 500px;
            height: 350px;
            background-image: radial-gradient(circle at 50% 30%, #3cd0ff 20%, #1593c2 70%, #0a5b7a 100%);
            border: 14px solid #dcdde1;
            border-radius: 24px;
            box-shadow: inset 0px 12px 25px rgba(0,0,0,0.45), 0px 12px 24px rgba(0,0,0,0.25);
            z-index: 3;
        }

        .pool-mat {
            position: absolute;
            width: 110px;
            height: 65px;
            background-image: repeating-linear-gradient(0deg, #fbc531, #fbc531 10px, #e1b12c 10px, #e1b12c 20px);
            border-radius: 6px;
            box-shadow: 0px 6px 12px rgba(0,0,0,0.4), inset 0px 2px 4px rgba(255,255,255,0.3);
            border: 3px solid #b38610;
            z-index: 4;
        }

        .mat1 { left: 30px; top: 140px; }
        .mat2 { left: 190px; top: 140px; }
        .mat3 { left: 350px; top: 140px; }

        /* ==========================================================
           6. CHARACTER SYSTEM MATRIX RIG CONFIGURATION
           ========================================================== */
        .character {
            position: absolute;
            left: 1900px; 
            top: 1900px;
            width: 120px;
            height: 120px;
            z-index: 25;
            will-change: transform, left, top;
        }

        .char-body {
            position: absolute;
            left: 30px;
            top: 30px;
            width: 60px;
            height: 60px;
            background-color: #e84118;
            border-radius: 50%;
            border: 4px solid #c23616;
            z-index: 3;
            box-shadow: 0px 6px 10px rgba(0,0,0,0.3);
        }

        .char-head {
            position: absolute;
            left: 40px;
            top: 40px;
            width: 40px;
            height: 40px;
            background-color: #fbc531;
            border-radius: 50%;
            border: 4px solid #e1b12c;
            z-index: 4;
        }

        .sleeve-l1 { 
            position: absolute; 
            left: 4px; 
            top: 44px; 
            width: 24px; 
            height: 24px; 
            background-color: #e84118; 
            border: 2px solid #c23616;
            border-radius: 50%;
            z-index: 2; 
        }

        .hand-l2 { 
            position: absolute; 
            left: -6px; 
            top: 47px; 
            width: 18px; 
            height: 18px; 
            background-color: #fbc531; 
            border: 2px solid #e1b12c;
            border-radius: 50%;
            z-index: 2; 
        }

        .sleeve-r1 { 
            position: absolute; 
            right: 4px; 
            top: 44px; 
            width: 24px; 
            height: 24px; 
            background-color: #e84118; 
            border: 2px solid #c23616;
            border-radius: 50%;
            z-index: 2; 
        }

        .hand-r2 { 
            position: absolute; 
            right: -6px; 
            top: 47px; 
            width: 18px; 
            height: 18px; 
            background-color: #fbc531; 
            border: 2px solid #e1b12c;
            border-radius: 50%;
            z-index: 2; 
        }

        .leg-l { 
            position: absolute; 
            left: 32px; 
            bottom: 12px; 
            width: 22px; 
            height: 22px; 
            background-color: #353b48; 
            border: 2px solid #2f3640;
            border-radius: 50%;
            z-index: 1; 
        }

        .leg-r { 
            position: absolute; 
            left: 66px; 
            bottom: 12px; 
            width: 22px; 
            height: 22px; 
            background-color: #353b48; 
            border: 2px solid #2f3640;
            border-radius: 50%;
            z-index: 1; 
        }

        /* ==========================================================
           7. HEADS-UP DISPLAY OVERLAY ARCHITECTURE
           ========================================================== */
        #UI-overlay {
            position: fixed;
            top: 24px;
            left: 24px;
            background-color: rgba(11, 15, 25, 0.92);
            color: #f5f6fa;
            padding: 16px 24px;
            border-radius: 12px;
            z-index: 200;
            pointer-events: none;
            border: 2px solid #fbc531;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.5);
        }
    </style>
</head>

    <script>
        /* ========================================================================
           8. JAVASCRIPT HARDENED CORE RUNTIME VECTOR COLLISION COMPUTATION ENGINE
           ======================================================================== */
        const map = document.getElementById('main-map');
        const viewport = document.getElementById('viewport');
        const player = document.querySelector('.character');
        const mudPatches = document.querySelectorAll('.mud-patch');
        const treeContainer = document.getElementById('tree-container');

        // Linear Runtime Engine Vector Space Coordinates
        let playerX = 1900;
        let playerY = 1900;
        const playerSize = 50; 
        const playerOffset = 35; 

        // Velocity Tracking Configuration Profiles
        let gameActive = false;
        const NORMAL_SPEED = 8;
        const MUD_SPEED = 3;
        let currentSpeed = NORMAL_SPEED;

        // Buffered Real-Time Keyboard Input Register Map
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false,
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false
        };
        
        // Matrix Registry Arrays
        let obstacles = [];
        const mapSize = 5000;

        /**
         * Generates border obstacles and distributed structural environmental sprites
         */
        function populateMapEnvironment() {
            // Instantiates solid outer running perimeter arrays
            for (let i = 0; i < mapSize; i += 100) {
                createTreeObstacle(i, 0, 'border-tree');
                createTreeObstacle(i, mapSize - 130, 'border-tree'); 
                createTreeObstacle(0, i, 'border-tree'); 
                createTreeObstacle(mapSize - 130, i, 'border-tree');
            }
            
            // Randomly samples clear coordinate sectors for decoration placement
            for (let i = 0; i < 95; i++) {
                let randX = Math.floor(Math.random() * (mapSize - 450)) + 220;
                let randY = Math.floor(Math.random() * (mapSize - 450)) + 220;
                
                // Exclude coordinates colliding with heavy built structures
                const insidePoolZone = (randX > 1200 && randX < 2100 && randY > 2300 && randY < 3050);
                // (Rest of the loop logic if added later can safely build here)
            }
        }
        
        // Stub functions for creation hooks
        function createTreeObstacle(x, y, className) {
            const tree = document.createElement('div');
            tree.className = className;
            tree.style.left = x + 'px';
            tree.style.top = y + 'px';
            treeContainer.appendChild(tree);
        }

        // Initialize engine environments
        populateMapEnvironment();
        gameActive = true; 
    </script>
