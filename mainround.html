    <script>
        /* ========================================================================
           8. JAVASCRIPT HARDENED CORE RUNTIME VECTOR COLLISION COMPUTATION ENGINE
           ======================================================================== */
        const map = document.getElementById('main-map');
        const viewport = document.getElementById('viewport');
        const player = document.querySelector('.character');
        const mudPatches = document.querySelectorAll('.mud-patch');
        const treeContainer = document.getElementById('tree-container');

        // Linear Runtime Engine Vector Space Coordinates
        let playerX = 1900;
        let playerY = 1900;
        const playerSize = 50; 
        const playerOffset = 35; 

        // Velocity Tracking Configuration Profiles
        let gameActive = false;
        const NORMAL_SPEED = 8;
        const MUD_SPEED = 3;
        let currentSpeed = NORMAL_SPEED;

        // Buffered Real-Time Keyboard Input Register Map
        const keys = {
            w: false,
            a: false,
            s: false,
            d: false,
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false
        };
        
        // Matrix Registry Arrays
        let obstacles = [];
        const mapSize = 5000;

        /**
         * Generates border obstacles and distributed structural environmental sprites
         */
        function populateMapEnvironment() {
            // Instantiates solid outer running perimeter arrays
            for (let i = 0; i < mapSize; i += 100) {
                createTreeObstacle(i, 0, 'border-tree');
                createTreeObstacle(i, mapSize - 130, 'border-tree'); 
                createTreeObstacle(0, i, 'border-tree'); 
                createTreeObstacle(mapSize - 130, i, 'border-tree');
            }
            
            // Randomly samples clear coordinate sectors for decoration placement
            for (let i = 0; i < 95; i++) {
                let randX = Math.floor(Math.random() * (mapSize - 450)) + 220;
                let randY = Math.floor(Math.random() * (mapSize - 450)) + 220;
                
                // Exclude coordinates colliding with heavy built structures
                const insidePoolZone = (randX > 1200 && randX < 2100 && randY > 2300 && randY < 3050);
                const insideHouseZone = (randX > 2000 && randX < 3400 && randY > 1600 && randY < 3000);
                
                // Verify against isolated hedge lanes
                const insideHedgeZone1 = (randX > 2400 && randY < 4300);
                const insideHedgeZone2 = (randX < 1600 && randY < 2400);
                const insideHedgeZone3 = (randX < 1600 && randY > 2400 && randY < 4900);

                if (!insidePoolZone && !insideHouseZone && !insideHedgeZone1 && !insideHedgeZone2 && !insideHedgeZone3) {
                    createTreeObstacle(randX, randY, 'map-tree');
                }
            }
        }

        /**
         * Generates visual components and pushes structural models to analytical loop buffers
         */
        function createTreeObstacle(x, y, className) {
            const tree = document.createElement('div');
            tree.className = className;
            tree.style.left = x + 'px';
            tree.style.top = y + 'px';
            treeContainer.appendChild(tree);
            
            const radius = className === 'border-tree' ? 65 : 75;
            obstacles.push({
                type: 'circle',
                x: x + radius,
                y: y + radius,
                radius: radius - 22
            });
        }

        /**
         * Loads exact structural box specifications directly into execution tracking registers
         */
        function initializeObstacleMatrix() {
            // LARGER L-SHAPED HOUSE COMPOSITE RECT COORDS (1200x1200px Main Footprint)
            // Section Alpha: Left Tower Base Main Segment Block
            obstacles.push({ type: 'rect', x: 2100, y: 1700, w: 360, h: 800 });
            // Section Beta: Top Right Linear Corridor Wing Box
            obstacles.push({ type: 'rect', x: 2460, y: 1700, w: 440, h: 360 });

            // HYDRAULIC TRAP SPECIFICATIONS
            obstacles.push({ type: 'rect', x: 1400, y: 2500, w: 500, h: 350, isPoolWater: true });

            // MASTER MAZE ARCHITECTURE SPECIFICATION REGISTRY entries
            // Northern Flank
            obstacles.push({ type: 'rect', x: 3500, y: 250,  w: 1250, h: 130 });
            obstacles.push({ type: 'rect', x: 4620, y: 380,  w: 130,  h: 950 });
            obstacles.push({ type: 'rect', x: 3850, y: 600,  w: 450,  h: 110 });
            obstacles.push({ type: 'rect', x: 3500, y: 950,  w: 800,  h: 120 });

            // Eastern & Southern Flank Extensions
            obstacles.push({ type: 'rect', x: 4200, y: 1200, w: 150,  h: 1100 });
            obstacles.push({ type: 'rect', x: 3400, y: 1500, w: 500,  h: 140 });
            obstacles.push({ type: 'rect', x: 3000, y: 1800, w: 150,  h: 900 });
            obstacles.push({ type: 'rect', x: 3150, y: 2560, w: 700,  h: 140 });
            obstacles.push({ type: 'rect', x: 3850, y: 2900, w: 150,  h: 800 });
            obstacles.push({ type: 'rect', x: 2600, y: 3600, w: 1400, h: 150 });
            obstacles.push({ type: 'rect', x: 2300, y: 3100, w: 150,  h: 650 });
            obstacles.push({ type: 'rect', x: 800,  y: 4100, w: 1200, h: 140 });

            // Western Perimeter Formations
            obstacles.push({ type: 'rect', x: 250,  y: 500,  w: 140,  h: 1200 });
            obstacles.push({ type: 'rect', x: 390,  y: 1560, w: 600,  h: 140 });
            obstacles.push({ type: 'rect', x: 850,  y: 250,  w: 140,  h: 850 });
            obstacles.push({ type: 'rect', x: 1400, y: 700,  w: 800,  h: 140 });

            // Southern Complex Extensions
            obstacles.push({ type: 'rect', x: 200,  y: 2500, w: 800,  h: 150 });
            obstacles.push({ type: 'rect', x: 200,  y: 2650, w: 150,  h: 900 });
            obstacles.push({ type: 'rect', x: 350,  y: 3400, w: 1100, h: 150 });

            // Center Ground Complex Entries
            obstacles.push({ type: 'rect', x: 1400, y: 1200, w: 140,  h: 700 });
            obstacles.push({ type: 'rect', x: 1540, y: 1200, w: 400,  h: 140 });

            // Dense Grid Infill Expansion Allocations
            obstacles.push({ type: 'rect', x: 200,  y: 3800, w: 450,  h: 130 });
            obstacles.push({ type: 'rect', x: 500,  y: 1900, w: 450,  h: 140 });
            obstacles.push({ type: 'rect', x: 1100, y: 2100, w: 130,  h: 350 });
            obstacles.push({ type: 'rect', x: 2600, y: 200,  w: 700,  h: 140 });
            obstacles.push({ type: 'rect', x: 2800, y: 500,  w: 140,  h: 600 });
            obstacles.push({ type: 'rect', x: 2200, y: 1100, w: 650,  h: 130 });
            obstacles.push({ type: 'rect', x: 1800, y: 4400, w: 650,  h: 145 });
            obstacles.push({ type: 'rect', x: 4400, y: 2500, w: 400,  h: 150 });
            obstacles.push({ type: 'rect', x: 4500, y: 2800, w: 150,  h: 900 });
            obstacles.push({ type: 'rect', x: 3200, y: 4100, w: 900,  h: 140 });
            obstacles.push({ type: 'rect', x: 1100, y: 4500, w: 150,  h: 400 });
            obstacles.push({ type: 'rect', x: 200,  y: 4500, w: 600,  h: 150 });

            // SOLID GRANITE STRUCTURAL BOX ENTRIES
            document.querySelectorAll('.rock').forEach(rock => {
                obstacles.push({
                    type: 'rect',
                    x: parseInt(rock.style.left),
                    y: parseInt(rock.style.top),
                    w: parseInt(rock.style.width),
                    h: parseInt(rock.style.height)
                });
            });
        }

        // Window Event Mapping Registers
        window.addEventListener('keydown', (e) => { 
            if (e.key in keys) {
                keys[e.key] = true; 
            }
        });

        window.addEventListener('keyup', (e) => { 
            if (e.key in keys) {
                keys[e.key] = false; 
            }
        });
        
        /**
         * Validates absolute coordinate models against terrain objects for speed modulation
         */
        function checkMudCollision(x, y) {
            const px = x + 60;
            const py = y + 60;
            let insideMud = false;
            
            mudPatches.forEach(patch => {
                const mx = parseInt(patch.style.left);
                const my = parseInt(patch.style.top);
                const mw = parseInt(patch.style.width);
                const mh = parseInt(patch.style.height);
                
                if (px >= mx && px <= (mx + mw) && py >= my && py <= (my + mh)) {
                    insideMud = true;
                }
            });
            return insideMud;
        }

        /**
         * Tracks precise movement matrix inside swimming pool boundary sets
         */
        function checkWalkboardPlatformSafety(x, y) {
            const px = x + playerOffset + (playerSize / 2);
            const py = y + playerOffset + (playerSize / 2);
            
            const mats = [
                { x: 1430, y: 2640, w: 110, h: 65 },
                { x: 1590, y: 2640, w: 110, h: 65 },
                { x: 1750, y: 2640, w: 110, h: 65 }
            ];
            
            return mats.some(m => px >= m.x && px <= (m.x + m.w) && py >= m.y && py <= (m.y + m.h));
        }

        /**
         * Resolves vector intersections across geometric primitive lists
         */
        function processEnvironmentIntersection(targetX, targetY) {
            const px = targetX + playerOffset;
            const py = targetY + playerOffset;
            const pw = playerSize;
            const ph = playerSize;
            
            const pCenterX = px + pw / 2;
            const pCenterY = py + ph / 2;

            // Enforce outer world running dimensions
            if (px < 130 || px + pw > 4870 || py < 130 || py + ph > 4870) {
                return true;
            }
            
            // Loop through master obstacle data matrix registers
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                
                if (obs.type === 'rect') {
                    if (obs.isPoolWater && checkWalkboardPlatformSafety(targetX, targetY)) {
                        continue;
                    }
                    
                    const intersectX = px < obs.x + obs.w && px + pw > obs.x;
                    const intersectY = py < obs.y + obs.h && py + ph > obs.y;
                    
                    if (intersectX && intersectY) {
                        return true;
                    }
                } 
                else if (obs.type === 'circle') {
                    const distX = pCenterX - obs.x;
                    const distY = pCenterY - obs.y;
                    const distanceVector = Math.sqrt(distX * distX + distY * distY);
                    
                    if (distanceVector < (pw / 2) + obs.radius) {
                        return true;
                    }
                }
            }
            return false;
        }

        /**
         * Core high-precision animation loop for processing positional vectors and view tracking
         */
        function coreExecutionEngine() {
            if (!gameActive) return;

            // Process systemic background slowdown fields
            if (checkMudCollision(playerX, playerY)) {
                currentSpeed = MUD_SPEED;
                player.style.filter = "sepia(0.6) brightness(0.75)";
            } else {
                currentSpeed = NORMAL_SPEED;
                player.style.filter = "none";
            }

            let nextX = playerX;
            let nextY = playerY;

            // Query active running input registers
            if (keys.w || keys.ArrowUp) {
                nextY -= currentSpeed;
            }
            if (keys.s || keys.ArrowDown) {
                nextY += currentSpeed;
            }
            if (keys.a || keys.ArrowLeft) {
                nextX -= currentSpeed;
            }
            if (keys.d || keys.ArrowRight) {
                nextX += currentSpeed;
            }

            // Separated Axis Theorem Vector Checks
            if (!processEnvironmentIntersection(nextX, playerY)) {
                playerX = nextX;
            }
            if (!processEnvironmentIntersection(playerX, nextY)) {
                playerY = nextY;
            }

            // Synchronize interface nodes to screen space coordinates
            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';

            const internalViewportWidth = window.innerWidth;
            const internalViewportHeight = window.innerHeight;
            
            // Dynamic lens target calculation formulas
            viewport.scrollLeft = playerX - (internalViewportWidth / 2) + 60;
            viewport.scrollTop = playerY - (internalViewportHeight / 2) + 60;

            requestAnimationFrame(coreExecutionEngine);
        }

        /**
         * Global engine initialization pipeline sequencing
         */
        function startEngineBootstrap() {
            populateMapEnvironment();
            initializeObstacleMatrix();
            gameActive = true;
            requestAnimationFrame(coreExecutionEngine);
        }

        // Fire bootstrap loops
        startEngineBootstrap();
    </script>
