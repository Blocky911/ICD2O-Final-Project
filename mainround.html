<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Royale - Refined Map</title>
    <style>
        /* ==========================================
           1. BASE VIEWPORT & LAYOUT SETUP
           ========================================== */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            user-select: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            position: relative;
            display: block; /* Launches instantly */
        }

        /* ==========================================
           2. MAIN MAP & PROCEDURAL TEXTURES
           ========================================== */
        #main-map {
            width: 5000px;
            height: 5000px;
            position: relative;
            background-color: #458b00;
            background-image: 
                radial-gradient(#556b2f 15%, transparent 16%),
                radial-gradient(#3a5f0b 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        /* ==========================================
           3. ENVIRONMENT & OBSTACLES
           ========================================== */
        .border-tree {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #2e5c1e 60%, #1a3610 100%);
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .map-tree {
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #3b7a24 50%, #224715 100%);
            border-radius: 50%;
            box-shadow: 0 15px 25px rgba(0,0,0,0.45);
                }
        
                /* fallback end of stylesheet, close remaining blocks */
            </style>
        </head>
        <body>
            <div id="viewport">
                <div id="main-map"></div>
            </div>
        </body>
        </html>
