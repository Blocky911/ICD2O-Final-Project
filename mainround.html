<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Royale</title>
</head>
<body>

    <div id="viewport">
        <div id="main-map">
            
            <div class="mud-patch" style="left: 1100px; top: 1350px; width: 500px; height: 380px;"></div>
            <div class="mud-patch" style="left: 3400px; top: 2000px; width: 450px; height: 320px;"></div>
            <div class="mud-patch" style="left: 1750px; top: 3500px; width: 600px; height: 450px;"></div>

            <div id="main-pool" class="pool">
                <div class="pool-mat mat1"></div>
                <div class="pool-mat mat2"></div>
                <div class="pool-mat mat3"></div>
            </div>

            <div class="cut-hedge" style="left: 3500px; top: 250px; width: 1250px; height: 130px;"></div>
            <div class="cut-hedge" style="left: 4620px; top: 380px; width: 130px; height: 950px;"></div>
            <div class="cut-hedge" style="left: 3850px; top: 600px; width: 450px; height: 110px;"></div>
            <div class="cut-hedge" style="left: 3500px; top: 950px; width: 800px; height: 120px;"></div>
            <div class="cut-hedge" style="left: 4200px; top: 1200px; width: 150px; height: 1100px;"></div>
            <div class="cut-hedge" style="left: 3400px; top: 1500px; width: 500px; height: 140px;"></div>
            <div class="cut-hedge" style="left: 3000px; top: 1800px; width: 150px; height: 900px;"></div>
            <div class="cut-hedge" style="left: 2600px; top: 200px; width: 700px; height: 140px;"></div>
            <div class="cut-hedge" style="left: 2800px; top: 500px; width: 140px; height: 600px;"></div>

            <div id="main-house" class="image-house">
                <div class="house-drop-shadow"></div>
                <div class="house-yellow-deck">
                    <div class="deck-fixture fx1"></div>
                    <div class="deck-fixture fx2"></div>
                    <div class="deck-fixture fx3"></div>
                </div>
                <div class="house-roof-body">
                    <div class="roof-ridge-line ridge-long-v"></div>
                    <div class="roof-ridge-line ridge-short-h"></div>
                    <div class="ridge-diagonal diag1"></div>
                    <div class="ridge-diagonal diag2"></div>
                    <div class="ridge-diagonal diag3"></div>
                    <div class="ridge-diagonal diag4"></div>
                </div>
            </div>

            <div class="rock" style="left: 950px; top: 1850px; width: 140px; height: 120px;"></div>
            <div class="rock" style="left: 1750px; top: 1100px; width: 190px; height: 150px;"></div>
            <div class="rock" style="left: 2150px; top: 1350px; width: 110px; height: 95px;"></div>
            <div class="rock" style="left: 1350px; top: 3100px; width: 160px; height: 140px;"></div>

            <div class="character">
                <div class="char-head"></div>
                <div class="char-body"></div>
                <div class="sleeve-l1"></div>
                <div class="hand-l2"></div>
                <div class="sleeve-r1"></div>
                <div class="hand-r2"></div>
                <div class="leg-l"></div>
                <div class="leg-r"></div>
            </div>

            <div id="tree-container"></div>
        </div>
    </div>

    <script>
        /* ========================================================================
           8. CORE RUNTIME ENGINE & VECTOR COLLISION CONTROLLER
           ======================================================================== */
        const map = document.getElementById('main-map');
        const viewport = document.getElementById('viewport');
        const player = document.querySelector('.character');
        const mudPatches = document.querySelectorAll('.mud-patch');
        const treeContainer = document.getElementById('tree-container');

        let playerX = 1900, playerY = 1900;
        const playerSize = 50, playerOffset = 35;
        let gameActive = false;
        const NORMAL_SPEED = 8, MUD_SPEED = 3;
        let currentSpeed = NORMAL_SPEED;
        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false
        };
        let obstacles = [];
        const mapSize = 5000;

        function populateMapEnvironment() {
            // Draw map borders using tree barriers
            for (let i = 0; i < mapSize; i += 100) {
                createTreeObstacle(i, 0, 'border-tree');
                createTreeObstacle(i, mapSize - 130, 'border-tree'); 
                createTreeObstacle(0, i, 'border-tree'); 
                createTreeObstacle(mapSize - 130, i, 'border-tree');
            }
            
            // CLEANED DOWN TO A BALANCED 120 TREES
            for (let i = 0; i < 120; i++) {
                let randX = Math.floor(Math.random() * (mapSize - 450)) + 220;
                let randY = Math.floor(Math.random() * (mapSize - 450)) + 220;

                // Safety boundaries to prevent trees spawning on top of game pieces
                const insidePoolZone = (randX > 1200 && randX < 2100 && randY > 2300 && randY < 3050);
                const insideHouseZone = (randX > 1950 && randX < 3450 && randY > 1550 && randY < 3050);
                
                // Top-right hedge quadrant zone safety buffer
                const insideHedgeZone = (randX > 2500 && randY < 2500);
                
                // Spawn buffer around character start location
                const insideSpawnZone = (randX > 1750 && randX < 2050 && randY > 1750 && randY < 2050);

                if (!insidePoolZone && !insideHouseZone && !insideHedgeZone && !insideSpawnZone) {
                    createTreeObstacle(randX, randY, 'map-tree');
                }
            }
        }

        function createTreeObstacle(x, y, className) {
            const tree = document.createElement('div');
            tree.className = className;
            tree.style.left = x + 'px';
            tree.style.top = y + 'px';
            treeContainer.appendChild(tree);
            const radius = className === 'border-tree' ? 65 : 75;
            obstacles.push({ type: 'circle', x: x + radius, y: y + radius, radius: radius - 22 });
        }

        function initializeObstacleMatrix() {
            obstacles.push({ type: 'rect', x: 2100, y: 1700, w: 360, h: 800 });
            obstacles.push({ type: 'rect', x: 2460, y: 1700, w: 440, h: 360 });
            obstacles.push({ type: 'rect', x: 1400, y: 2500, w: 500, h: 350, isPoolWater: true });
            
            // MASTER OBSTACLE MATRIX: SYNCED TOP-RIGHT HEDGES ONLY
            obstacles.push({ type: 'rect', x: 3500, y: 250,  w: 1250, h: 130 });
            obstacles.push({ type: 'rect', x: 4620, y: 380,  w: 130,  h: 950 });
            obstacles.push({ type: 'rect', x: 3850, y: 600,  w: 450,  h: 110 });
            obstacles.push({ type: 'rect', x: 3500, y: 950,  w: 800,  h: 120 });
            obstacles.push({ type: 'rect', x: 4200, y: 1200, w: 150,  h: 1100 });
            obstacles.push({ type: 'rect', x: 3400, y: 1500, w: 500,  h: 140 });
            obstacles.push({ type: 'rect', x: 3000, y: 1800, w: 150,  h: 900 });
            obstacles.push({ type: 'rect', x: 2600, y: 200,  w: 700,  h: 140 });
            obstacles.push({ type: 'rect', x: 2800, y: 500,  w: 140,  h: 600 });

            document.querySelectorAll('.rock').forEach(rock => {
                obstacles.push({
                    type: 'rect',
                    x: parseInt(rock.style.left), y: parseInt(rock.style.top),
                    w: parseInt(rock.style.width), h: parseInt(rock.style.height)
                });
            });
        }

        window.addEventListener('keydown', (e) => { if (e.key in keys) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (e.key in keys) keys[e.key] = false; });
        
        function checkMudCollision(x, y) {
            const px = x + 60, py = y + 60;
            let insideMud = false;
            mudPatches.forEach(patch => {
                const mx = parseInt(patch.style.left), my = parseInt(patch.style.top);
                const mw = parseInt(patch.style.width), mh = parseInt(patch.style.height);
                if (px >= mx && px <= (mx + mw) && py >= my && py <= (my + mh)) insideMud = true;
            });
            return insideMud;
        }

        function isOverPoolWalkboard(targetX, targetY) {
            const px = targetX + playerOffset, py = targetY + playerOffset;
            const pw = playerSize, ph = playerSize;
            const walkboards = [
                { x: 1430, y: 2640, w: 110, h: 65 },
                { x: 1590, y: 2640, w: 110, h: 65 },
                { x: 1750, y: 2640, w: 110, h: 65 }
            ];
            return walkboards.some(board => px < board.x + board.w && px + pw > board.x && py < board.y + board.h && py + ph > board.y);
        }

        function processEnvironmentIntersection(targetX, targetY) {
            const px = targetX + playerOffset, py = targetY + playerOffset;
            const pw = playerSize, ph = playerSize;
            const pCenterX = px + pw / 2, pCenterY = py + ph / 2;
            if (px < 130 || px + pw > 4870 || py < 130 || py + ph > 4870) return true;
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                if (obs.type === 'rect') {
                    if (obs.isPoolWater) {
                        const isOnWalkboard = isOverPoolWalkboard(targetX, targetY);
                        const isWithinBoardGap = (px >= 1420 && px + pw <= 1860 && py >= 2625 && py + ph <= 2710);
                        if (isOnWalkboard || isWithinBoardGap) continue;
                    }
                    if (px < obs.x + obs.w && px + pw > obs.x && py < obs.y + obs.h && py + ph > obs.y) return true;
                } else if (obs.type === 'circle') {
                    const distX = pCenterX - obs.x, distY = pCenterY - obs.y;
                    if (Math.sqrt(distX * distX + distY * distY) < (pw / 2) + obs.radius) return true;
                }
            }
            return false;
        }

        function coreExecutionEngine() {
            if (!gameActive) return;
            if (checkMudCollision(playerX, playerY)) {
                currentSpeed = MUD_SPEED;
                player.style.filter = "sepia(0.6) brightness(0.75)";
            } else {
                currentSpeed = NORMAL_SPEED;
                player.style.filter = "none";
            }

            let nextX = playerX, nextY = playerY;
            if (keys.w || keys.ArrowUp) nextY -= currentSpeed;
            if (keys.s || keys.ArrowDown) nextY += currentSpeed;
            if (keys.a || keys.ArrowLeft) nextX -= currentSpeed;
            if (keys.d || keys.ArrowRight) nextX += currentSpeed;

            if (!processEnvironmentIntersection(nextX, playerY)) playerX = nextX;
            if (!processEnvironmentIntersection(playerX, nextY)) playerY = nextY;

            player.style.left = playerX + 'px';
            player.style.top = playerY + 'px';
            viewport.scrollLeft = playerX - (window.innerWidth / 2) + 60;
            viewport.scrollTop = playerY - (window.innerHeight / 2) + 60;

            requestAnimationFrame(coreExecutionEngine);
        }

        function startEngineBootstrap() {
            populateMapEnvironment();
            initializeObstacleMatrix();
            gameActive = true;
            requestAnimationFrame(coreExecutionEngine);
        }

        startEngineBootstrap();
    </script>
</body>
</html>
