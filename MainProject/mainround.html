<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Royale - Absolute Visibility Fix</title>
    <style>
        /* ==========================================
           1. HARD-LOCKED BASE VIEWPORT STYLES
           ========================================== */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c1015; /* The dark page background */
            font-family: sans-serif;
        }

        /* This container forces the game to stay visible on your screen */
        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            display: block !important;
        }

        /* The giant map arena */
        #main-map {
            width: 5000px;
            height: 5000px;
            position: absolute;
            background-color: #4b861d; /* Grass Green */
            background-image: 
                radial-gradient(#5a9727 15%, transparent 16%),
                radial-gradient(#3f7416 15%, transparent 16%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
        }

        /* ==========================================
           2. MAP STRUCTURES & OBSTACLES
           ========================================== */
        .house-container {
            position: absolute;
            left: 2200px;
            top: 2100px;
            width: 500px; 
            height: 340px;
            z-index: 5;
        }
        .house-base {
            width: 100%;
            height: 100%;
            position: absolute;
            background-color: #a22c26;
            border: 5px solid #5a1512;
            box-sizing: border-box;
        }
        .house-door {
            position: absolute;
            bottom: 0;
            left: 80px;
            width: 70px;
            height: 120px;
            background: #fbc531;
        }

        .big-hedge {
            position: absolute;
            left: 2850px;
            top: 2200px;
            width: 320px;
            height: 320px;
            background: #1e8449;
            border-radius: 50%;
            z-index: 6;
        }

        .pool {
            position: absolute;
            left: 1400px;
            top: 2500px;
            width: 500px;
            height: 350px;
            background: #0fbcf9;
            border: 12px solid #d1d8e0;
            z-index: 2;
            box-sizing: border-box;
        }
        .pool-mat {
            position: absolute;
            width: 110px;
            height: 70px;
            background: #ffca28;
            border: 3px solid #b78103;
            z-index: 3;
        }
        .mat1 { left: 40px; top: 130px; }
        .mat2 { left: 180px; top: 130px; }
        .mat3 { left: 320px; top: 130px; }

        .border-tree {
            position: absolute;
            width: 120px;
            height: 120px;
            background: #1e4611;
            border-radius: 50%;
            z-index: 10;
        }
        .mud-patch {
            position: absolute;
            background: #523610;
            opacity: 0.9;
            z-index: 1;
        }

        /* ==========================================
           3. SIMPLIFIED EXTRA-VISIBLE CHARACTER
           ========================================== */
        .character {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #eb2f06; /* Bright Red Body */
            border: 4px solid #ffffff; /* Bright white border to see it easily */
            border-radius: 50%;
            z-index: 9999 !important; /* Force it on top of everything */
            box-shadow: 0 0 20px #ffffff; /* Glow effect so you spot it instantly */
        }

        #UI-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            z-index: 10000;
            border: 2px solid #fbc531;
        }
    </style>
</head>
<body>

    <div id="UI-overlay">
        <strong>SCREEN REFRESH SUCCESSFUL</strong><br>
        Use WASD or Arrow Keys to move your character.
    </div>

    <div id="viewport">
        <div id="main-map">
            
            <div class="mud-patch" style="left: 1100px; top: 1500px; width: 450px; height: 350px;"></div>

            <div id="main-pool" class="pool">
                <div class="pool-mat mat1"></div>
                <div class="pool-mat mat2"></div>
                <div class="pool-mat mat3"></div>
            </div>

            <div id="main-house" class="house-container">
                <div class="house-base">
                    <div class="house-door"></div>
                </div>
            </div>

            <div class="big-hedge"></div>

            <div class="character"></div>
