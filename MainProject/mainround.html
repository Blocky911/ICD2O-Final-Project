<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Royale - Remade Battle Map</title>
    <style>
        /* ==========================================
           1. VIEWPORT & ARENA BACKGROUND GRID
           ========================================== */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c1015;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #main-map {
            width: 5000px;
            height: 5000px;
            position: absolute;
            background-color: #4b861d;
            background-image: radial-gradient(#3f7416 18%, transparent 19%);
            background-size: 50px 50px;
            will-change: transform;
        }

        /* Boundary White Fences */
        .boundary-fence {
            position: absolute;
            background-color: #ffffff;
            border: 5px solid #000;
            z-index: 8;
        }
        .fence-top    { top: 100px; left: 100px; width: 4800px; height: 16px; background-image: linear-gradient(90deg, #fff 50%, #000 50%); background-size: 20px; }
        .fence-bottom { bottom: 100px; left: 100px; width: 4800px; height: 16px; background-image: linear-gradient(90deg, #fff 50%, #000 50%); background-size: 20px; }
        .fence-left   { top: 100px; left: 100px; width: 16px; height: 4800px; background-image: linear-gradient(0deg, #fff 50%, #000 50%); background-size: 20px; }
        .fence-right  { top: 100px; right: 100px; width: 16px; height: 4800px; background-image: linear-gradient(0deg, #fff 50%, #000 50%); background-size: 20px; }

        /* ==========================================
           2. NEW DESIGN: L-SHAPED HOUSE GRAPHICS
           ========================================== */
        .l-house {
            position: absolute;
            left: 2200px;
            top: 2500px;
            width: 500px;
            height: 500px;
            z-index: 5;
        }

        .porch-deck {
            position: absolute;
            background-color: #e2db6c;
            border: 5px solid #000;
            box-sizing: border-box;
        }
        .porch-top  { width: 540px; height: 210px; top: -20px; left: -20px; }
        .porch-left { width: 210px; height: 350px; top: 170px; left: -20px; }

        .roof-structure {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #cc6a4e;
            clip-path: polygon(0% 0%, 100% 0%, 100% 34%, 34% 34%, 34% 100%, 0% 100%);
            border: 6px solid #000;
            box-sizing: border-box;
        }

        .roof-seam {
            position: absolute;
            background-color: #7c3824;
        }
        .seam-vertical   { left: 165px; top: 0; width: 6px; height: 500px; opacity: 0.4; }
        .seam-horizontal { left: 0; top: 165px; width: 500px; height: 6px; opacity: 0.4; }

        /* ==========================================
           3. NEW DESIGN: TOP-RIGHT HEDGE MAZE
           ========================================== */
        .hedge-maze-container {
            position: absolute;
            left: 3300px;
            top: 600px;
            width: 800px;
            height: 800px;
            z-index: 4;
        }

        .hedge-arc {
            width: 600px;
            height: 600px;
            background-color: #22550e;
            border: 8px solid #1a3c08;
            border-radius: 50%;
            position: absolute;
            left: 100px;
            top: 100px;
            background-image: 
                repeating-linear-gradient(45deg, #163a09 0px, #163a09 4px, transparent 4px, transparent 12px),
                repeating-linear-gradient(-45deg, #163a09 0px, #163a09 4px, #22550e 4px, #22550e 12px);
        }

        .inner-maze-ground {
            width: 360px;
            height: 360px;
            background-color: #4b861d;
            border: 8px solid #1a3c08;
            border-radius: 50%;
            position: absolute;
            left: 2200px; /* Offset matched to map world coordinate calculations */
            left: 220px;
            top: 220px;
        }

        /* ==========================================
           4. ORIGINAL DESIGN: SWIMMING POOL & MATS
           ========================================== */
        .pool {
            position: absolute;
            left: 1400px;
            top: 2500px;
            width: 500px;
            height: 350px;
            background: radial-gradient(circle, #34e7f4 30%, #0fbcf9 100%);
            border: 12px solid #d1d8e0;
            border-radius: 16px;
            box-shadow: inset 0 12px 24px rgba(0,0,0,0.4);
            z-index: 2;
            box-sizing: border-box;
        }

        .pool-mat {
            position: absolute;
            width: 110px;
            height: 70px;
            background: repeating-linear-gradient(90deg, #ffca28, #ffca28 12px, #ffb300 12px, #ffb300 24px);
            border-radius: 6px;
            border: 3px solid #b78103;
            box-shadow: 0 6px 12px rgba(0,0,0,0.35);
            z-index: 3;
        }
        .mat1 { left: 40px; top: 130px; }
        .mat2 { left: 180px; top: 130px; }
        .mat3 { left: 320px; top: 130px; }

        /* Mud Patches & Scatter Objects */
        .mud-patch {
            position: absolute;
            background: #523610;
            border-radius: 40%;
            opacity: 0.9;
            z-index: 1;
        }

        .tree-canopy {
            position: absolute;
            background-color: #2d6a24;
            border: 5px solid #12330d;
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            z-index: 6;
        }

        .boulder {
            position: absolute;
            background-color: #838784;
            border: 4px solid #414241;
            border-radius: 40%;
            z-index: 3;
        }

        /* ==========================================
           5. CHARACTER ANATOMY LAYER (SURVIV.IO DESIGN)
           ========================================== */
        .character {
            position: absolute;
            width: 80px;
            height: 80px;
            z-index: 999 !important;
        }

        .player-body {
            position: absolute;
            left: 20px;
            top: 20px;
            width: 40px;
            height: 40px;
            background-color: #223c5e; /* Blue Vest Shirt */
            border: 4px solid #000;
            border-radius: 50%;
            box-sizing: border-box;
            z-index: 2;
        }

        .player-head-hair {
            position: absolute;
            left: 27px;
            top: 27px;
            width: 26px;
            height: 26px;
            background-color: #e8c42c; /* Spiky Blonde Hair */
            border: 3.5px solid #000;
            border-radius: 50%;
            box-sizing: border-box;
            z-index: 3;
        }

        .hand {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #ffdb99; /* Punch Skin Tone */
            border: 3px solid #000;
            border-radius: 50%;
            box-sizing: border-box;
            z-index: 4;
        }
        .hand-left  { top: 14px; right: 8px; }
        .hand-right { bottom: 14px; right: 8px; }

        #UI-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 14px 22px;
            border-radius: 8px;
            z-index: 10000;
            pointer-events: none;
            border: 2px solid #fbc531;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="UI-overlay">
        <div style="font-weight: bold; color: #fbc531; font-size: 1.1rem; margin-bottom: 2px;">MAP RECONSTRUCTION COMPLETE</div>
        <div style="font-size: 0.85rem; color: #cbd5e1;">Hedge Maze moved to Top Right. L-House design implemented. WASD to Move.</div>
    </div>

    <div id="viewport">
        <div id="main-map">
            
            <div class="boundary-fence fence-top"></div>
            <div class="boundary-fence fence-right"></div>
            <div class="boundary-fence fence-bottom"></div>
