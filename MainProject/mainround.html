<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Of The Yard - Main Round</title>

    <link rel="stylesheet" href="mainround.css">
</head>
<body>

    <div id="gameContainer">
        <div id="map">

            <!-- House -->
            <div class="house">
                <div class="roof"></div>
            </div>

            <!-- Pool -->
            <div class="pool">
                <div class="mat mat1"></div>
                <div class="mat mat2"></div>
                <div class="mat mat3"></div>
            </div>

            <!-- Mud -->
            <div class="mud mud1"></div>
            <div class="mud mud2"></div>

            <!-- Spikes -->
            <div class="spike spike1"></div>
            <div class="spike spike2"></div>

            <!-- Rocks -->
            <div class="rock rock1"></div>
            <div class="rock rock2"></div>

            <!-- Trees generated by JS -->
            <div id="treeContainer"></div>

            <!-- Player -->
            <div id="player">
                <div class="head"></div>
                <div class="body"></div>

                <div class="arm arm1"></div>
                <div class="arm arm2"></div>
                <div class="arm arm3"></div>
                <div class="arm arm4"></div>

                <div class="leg leg1"></div>
                <div class="leg leg2"></div>
            </div>

        </div>
    </div>

    <script src="mainround.js"></script>

</body>
</html>
