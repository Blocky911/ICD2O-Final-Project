<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Royale - Scrollable Map</title>
    <style>
        /* Base Setup */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            user-select: none;
        }

        /* Camera Viewport (The screen window) */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: auto; /* Enables scrolling */
            cursor: grab;
            position: relative;
        }

        #viewport:active {
            cursor: grabbing;
        }

        /* The Main Map (Huge 5000x5000 World) */
        #main-map {
            width: 5000px;
            height: 5000px;
            position: relative;
            /* Grass texture design using CSS gradients */
            background-color: #458b00;
            background-image: 
                radial-gradient(#556b2f 15%, transparent 16%),
                radial-gradient(#3a5f0b 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        /* --- MAP ELEMENTS --- */

        /* Border Trees (Surrounding the map edges) */
        .border-tree {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #2e5c1e 60%, #1a3610 100%);
            border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 10;
        }

        /* Scattered Map Trees */
        .map-tree {
            position: absolute;
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #3b7a24 50%, #224715 100%);
            border-radius: 50%;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Square House with Brick Style & Triangle Prism Roof */
        .house-container {
            position: absolute;
            left: 2200px;
            top: 2200px;
            width: 400px;
            height: 500px;
            z-index: 5;
        }
        /* Brick wall base */
        .house-base {
            width: 400px;
            height: 400px;
            position: absolute;
            bottom: 0;
            background-color: #b24223;
            /* Brick texture design */
            background-image: 
                linear-gradient(335deg, #8a3016 23px, transparent 23px),
                linear-gradient(155deg, #8a3016 23px, transparent 23px),
                linear-gradient(335deg, #8a3016 23px, transparent 23px),
                linear-gradient(155deg, #8a3016 23px, transparent 23px);
            background-size: 58px 58px;
            background-position: 0px 2px, 4px 35px, 29px 31px, 34px 6px;
            border: 4px solid #5a1e0e;
            box-shadow: 0 20px 30px rgba(0,0,0,0.4);
        }
        /* Triangle Prism Roof (2D Top-Down Projection) */
        .house-roof {
            width: 0;
            height: 0;
            position: absolute;
            top: 0;
            border-left: 204px solid transparent;
            border-right: 204px solid transparent;
            border-bottom: 100px solid #5c2c16; /* Roof slope color */
        }

        /* Pool with Walkable Floating Mats */
        .pool {
            position: absolute;
            left: 1500px;
            top: 2500px;
            width: 500px;
            height: 350px;
            background: radial-gradient(circle, #4ed4ff 40%, #1797c4 100%);
            border: 12px solid #d1d8e0;
            border-radius: 20px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .pool-mat {
            position: absolute;
            width: 100px;
            height: 60px;
            background: repeating-linear-gradient(0deg, #ffc048, #ffc048 10px, #ffa801 10px, #ffa801 20px);
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border: 2px solid #c57e00;
        }
        .mat1 { left: 40px; top: 60px; }
        .mat2 { left: 180px; top: 140px; }
        .mat3 { left: 320px; top: 220px; }

        /* Mud Patches (Slowing zones) */
        .mud-patch {
            position: absolute;
            background: #573b12;
            border-radius: 43% 57% 70% 30% / 45% 45% 55% 55%; /* Organic irregular shape */
            opacity: 0.9;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            z-index: 1;
        }

        /* Rocks with Rocky Textures */
        .rock {
            position: absolute;
            background-color: #778ca3;
            /* Rocky texture cracks using linear gradients */
            background-image: 
                linear-gradient(45deg, #4b5563 25%, transparent 25%), 
                linear-gradient(-45deg, #4b5563 25%, transparent 25%);
            background-size: 30px 30px;
            border-radius: 30% 70% 50% 50% / 50% 60% 40% 50%;
            border: 5px solid #4b6584;
            box-shadow: 5px 10px 15px rgba(0,0,0,0.3);
            z-index: 4;
        }

        /* --- CHARACTER DESIGN --- */
        /* Circle head, circle body, 4 sleeves/arms circles, 2 legs circles */
        .character {
            position: absolute;
            left: 2000px;
            top: 2100px;
            width: 120px;
            height: 120px;
            z-index: 20;
        }

        .char-body {
            position: absolute;
            left: 30px;
            top: 30px;
            width: 60px;
            height: 60px;
            background-color: #ff3838; /* Main body circle */
            border-radius: 50%;
            border: 3px solid #bc2020;
            z-index: 3;
        }

        .char-head {
            position: absolute;
            left: 40px;
            top: 40px;
            width: 40px;
            height: 40px;
            background-color: #ffdd59; /* Head circle */
            border-radius: 50%;
            border: 3px solid #e5c130;
            z-index: 4;
        }

        /* 4 Circles for Arms/Sleeves */
        .sleeve-l1 { position: absolute; left: 5px; top: 45px; width: 22px; height: 22px; background: #ff3838; border-radius: 50%; z-index: 2; }
        .hand-l2   { position: absolute; left: -5px; top: 48px; width: 16px; height: 16px; background: #ffdd59; border-radius: 50%; z-index: 2; }
        .sleeve-r1 { position: absolute; right: 5px; top: 45px; width: 22px; height: 22px; background: #ff3838; border-radius: 50%; z-index: 2; }
        .hand-r2   { position: absolute; right: -5px; top: 48px; width: 16px; height: 16px; background: #ffdd59; border-radius: 50%; z-index: 2; }

        /* 2 Circles for Legs */
        .leg-l { position: absolute; left: 33px; bottom: 10px; width: 20px; height: 20px; background: #2c3e50; border-radius: 50%; z-index: 1; }
        .leg-r { position: absolute; left: 67px; bottom: 10px; width: 20px; height: 20px; background: #2c3e50; border-radius: 50%; z-index: 1; }

        /* Instructions Overlay */
        #UI-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 100;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #ffd32a;
        }
    </style>
</head>
<body>

    <div id="UI-overlay">
        <h3>🏆 Tag Royale Map Preview</h3>
        <p>🖱️ <b>Click and drag</b> anywhere to scroll around the massive 5000x5000 map!</p>
        <p>🟩 Center coordinates loaded around: (2200, 2200)</p>
    </div>

    <div id="viewport">
        <div id="main-map" id="map">
            
            <div class="mud-patch" style="left: 1200px; top: 1400px; width: 450px; height: 300px;"></div>
            <div class="mud-patch" style="left: 2600px; top: 2100px; width: 350px; height: 250px;"></div>
            <div class="mud-patch" style="left: 1800px; top: 3200px; width: 500px; height: 400px;"></div>

            <div class="pool">
                <div class="pool-mat mat1"></div>
                <div class="pool-mat mat2"></div>
                <div class="pool-mat mat3"></div>
            </div>

            <div class="house-container">
                <div class="house-roof"></div>
                <div class="house-base"></div>
            </div>

            <div class="rock" style="left: 1000px; top: 1800px; width: 130px; height: 110px;"></div>
            <div class="rock" style="left: 2800px; top: 2600px; width: 180px; height: 140px;"></div>
            <div class="rock" style="left: 2100px; top: 1600px; width: 100px; height: 90px;"></div>
            <div class="rock" style="left: 1400px; top: 2900px; width: 150px; height: 130px;"></div>

            <div class="character">
                <div class="char-head"></div>
                <div class="char-body"></div>
                <div class="sleeve-l1"></div>
                <div class="hand-l2"></div>
                <div class="sleeve-r1"></div>
                <div class="hand-r2"></div>
                <div class="leg-l"></div>
                <div class="leg-r"></div>
            </div>

            <div id="tree-container"></div>

        </div>
    </div>

    <script>
        // --- 1. POPULATE TREES AROUND MAP EDGES AND SCATTERED INSIDE ---
        const treeContainer = document.getElementById('tree-container');
        const mapSize = 5000;

        // Generate Border Trees loops
        for (let i = 0; i < mapSize; i += 100) {
            createTree(i, 0, 'border-tree'); // Top border
            createTree(i, mapSize - 120, 'border-tree'); // Bottom border
            createTree(0, i, 'border-tree'); // Left border
            createTree(mapSize - 120, i, 'border-tree'); // Right border
        }

        // Randomly scatter 60 trees inside the map space safely
        for (let i = 0; i < 60; i++) {
            let randX = Math.floor(Math.random() * (mapSize - 400)) + 200;
            let randY = Math.floor(Math.random() * (mapSize - 400)) + 200;
            // Prevent spawning right on top of the starting middle house zone
            if (!(randX > 1900 && randX < 2700 && randY > 1900 && randY < 2700)) {
                createTree(randX, randY, 'map-tree');
            }
        }

        function createTree(x, y, className) {
            const tree = document.createElement('div');
            tree.className = className;
            tree.style.left = x + 'px';
            tree.style.top = y + 'px';
            treeContainer.appendChild(tree);
        }

        // --- 2. CLICK & DRAG TO SCROLL SYSTEM ---
        const view = document.getElementById('viewport');
        let isDown = false;
        let startX, startY, scrollLeft, scrollTop;

        // Start centering camera near the player/house upon loading
        view.scrollLeft = 1950;
        view.scrollTop = 1950;

        view.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - view.offsetLeft;
            startY = e.pageY - view.offsetTop;
            scrollLeft = view.scrollLeft;
            scrollTop = view.scrollTop;
        });
        view.addEventListener('mouseleave', () => { isDown = false; });
        view.addEventListener('mouseup', () => { isDown = false; });
        view.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - view.offsetLeft;
            const y = e.pageY - view.offsetTop;
            const walkX = (x - startX) * 1.5; // Scroll multiplier speed
            const walkY = (y - startY) * 1.5;
            view.scrollLeft = scrollLeft - walkX;
            view.scrollTop = scrollTop - walkY;
        });
    </script>
</body>
</html>
