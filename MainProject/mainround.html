<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Royale - Fixed Safe Spawn Arena</title>
    <style>
        /* ==========================================
           1. COMPACT INTEGRATED CSS LAYOUT
           ========================================== */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c1015;
            user-select: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            position: relative;
            display: block !important; /* Force visibility */
        }

        #main-map {
            width: 5000px;
            height: 5000px;
            position: relative;
            background-color: #4b861d;
            background-image: 
                radial-gradient(#5a9727 15%, transparent 16%),
                radial-gradient(#3f7416 15%, transparent 16%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
        }

        /* Red Wood House Layout */
        .house-container {
            position: absolute;
            left: 2200px;
            top: 2100px;
            width: 500px; 
            height: 340px;
            z-index: 5;
        }

        .house-base {
            width: 100%;
            height: 100%;
            position: absolute;
            bottom: 0;
            background-color: #a22c26;
            background-image: linear-gradient(0deg, rgba(0,0,0,0.15) 4px, transparent 4px);
            background-size: 100% 30px;
            border: 5px solid #5a1512;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            box-sizing: border-box;
            border-radius: 4px;
        }

        .house-roof {
            width: 0;
            height: 0;
            position: absolute;
            top: -95px;
            left: -5px;
            border-left: 250px solid transparent;
            border-right: 250px solid transparent;
            border-bottom: 95px solid #b83d35; 
        }

        .house-door {
            position: absolute;
            bottom: 0;
            left: 80px;
            width: 70px;
            height: 120px;
            background: #fbc531;
            border: 4px solid #5a1512;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            box-shadow: 0 0 20px rgba(251, 197, 49, 0.5);
        }

        .house-window {
            position: absolute;
            top: 100px;
            right: 80px;
            width: 90px;
            height: 90px;
            background: #edf2f7;
            border: 4px solid #5a1512;
            display: flex;
            flex-wrap: wrap;
        }

        .window-pane {
            width: calc(50% - 2px);
            height: calc(50% - 2px);
            border: 1px solid #718096;
            background: #7ed6df;
        }

        /* Round Bush Barrier */
        .big-hedge {
            position: absolute;
            left: 2850px;
            top: 2200px;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #27ae60 40%, #1e8449 80%, #145a32 100%);
            border-radius: 50%;
            border: 8px solid #0e3a20;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            z-index: 6;
        }

        /* Swimming Pool & Steps */
        .pool {
            position: absolute;
            left: 1400px;
            top: 2500px;
            width: 500px;
            height: 350px;
            background: radial-gradient(circle, #34e7f4 30%, #0fbcf9 100%);
            border: 12px solid #d1d8e0;
            border-radius: 16px;
            box-shadow: inset 0 12px 24px rgba(0,0,0,0.4);
            z-index: 2;
            box-sizing: border-box;
        }

        .pool-mat {
            position: absolute;
            width: 110px;
            height: 70px;
            background: repeating-linear-gradient(90deg, #ffca28, #ffca28 12px, #ffb300 12px, #ffb300 24px);
            border-radius: 6px;
            border: 3px solid #b78103;
            box-shadow: 0 6px 12px rgba(0,0,0,0.35);
            z-index: 3;
        }
        .mat1 { left: 40px; top: 130px; }
        .mat2 { left: 180px; top: 130px; }
        .mat3 { left: 320px; top: 130px; }

        /* Obstacles & Map Decoration */
        .border-tree {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #1e4611 50%, #0f2707 100%);
            border-radius: 50%;
            z-index: 10;
        }

        .map-tree {
            position: absolute;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, #2d6619 40%, #193d0c 100%);
            border-radius: 50%;
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .mud-patch {
            position: absolute;
            background: #523610;
            border-radius: 40% 60% 50% 50% / 50% 40% 60% 50%;
            opacity: 0.9;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
            z-index: 1;
        }

        .rock {
            position: absolute;
            background-color: #8395a7;
            border-radius: 18px;
            border: 4px solid #576574;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            z-index: 4;
        }

        /* Character Layout Anatomy */
        .character {
            position: absolute;
            width: 120px;
            height: 120px;
            z-index: 20;
            display: block !important; /* Lock display state */
        }

        .char-body {
            position: absolute;
            left: 35px;
            top: 35px;
            width: 50px;
            height: 50px;
            background-color: #eb2f06; 
            border-radius: 50%;
            border: 3px solid #b31600;
            z-index: 3;
        }

        .char-head {
            position: absolute;
            left: 43px;
            top: 43px;
            width: 34px;
            height: 34px;
            background-color: #fdd835; 
            border-radius: 50%;
            border: 3px solid #c4a300;
            z-index: 4;
        }

        .sleeve-l1 { position: absolute; left: 12px; top: 48px; width: 20px; height: 20px; background: #eb2f06; border-radius: 50%; z-index: 2; }
        .hand-l2   { position: absolute; left: 3px; top: 50px; width: 14px; height: 14px; background: #fdd835; border-radius: 50%; z-index: 2; }
        .sleeve-r1 { position: absolute; right: 12px; top: 48px; width: 20px; height: 20px; background: #eb2f06; border-radius: 50%; z-index: 2; }
        .hand-r2   { position: absolute; right: 3px; top: 50px; width: 14px; height: 14px; background: #fdd835; border-radius: 50%; z-index: 2; }
        .leg-l     { position: absolute; left: 38px; bottom: 20px; width: 16px; height: 16px; background: #1e272e; border-radius: 50%; z-index: 1; }
        .leg-r     { position: absolute; left: 66px; bottom: 20px; width: 16px; height: 16px; background: #1e272e; border-radius: 50%; z-index: 1; }

        #UI-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 14px 22px;
            border-radius: 8px;
            z-index: 100;
            pointer-events: none;
            border: 2px solid #fbc531;
        }
    </style>
</head>
<body>

    <div id="UI-overlay">
        <div style="font-weight: bold; color: #fbc531; margin-bottom: 4px;">SYSTEM OPERATIONAL</div>
        <div style="font-size: 0.85rem; color: #cbd5e1;">Use WASD or Arrow Keys to move. Walk on the yellow planks to cross the water!</div>
    </div>

    <div id="viewport">
        <div id="main-map">
            
            <div class="mud-patch" style="left: 1100px; top: 1500px; width: 450px; height: 350px;"></div>
            <div class="mud-patch" style="left: 3200px; top: 1800px; width: 400px; height: 300px;"></div>

            <div id="main-pool" class="pool">
                <div class="pool-mat mat1"></div>
                <div class="pool-mat mat2"></div>
                <div class="pool-mat mat3"></div>
            </div>

            <div id="main-house" class="house-container">
                <div class="house-roof"></div>
                <div class="house-base">
                    <div class="house-door"></div>
                    <div class="house-window">
                        <div class="window-pane"></div>
                        <div class="window-pane"></div>
                        <div class="window-pane"></div>
