<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Royale - 100% Guaranteed Fixed Arena</title>
    <style>
        /* ==========================================
           1. CORE VIEWPORT & GRASS MAP STYLES
           ========================================== */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0c1015;
            user-select: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            position: relative;
            display: block !important; /* Force render */
        }

        #main-map {
            width: 5000px;
            height: 5000px;
            position: relative;
            background-color: #4b861d;
            background-image: 
                radial-gradient(#5a9727 15%, transparent 16%),
                radial-gradient(#3f7416 15%, transparent 16%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
        }

        /* ==========================================
           2. NEW RED WOOD HOUSE STRUCTURE
           ========================================== */
        .house-container {
            position: absolute;
            left: 2200px;
            top: 2100px;
            width: 500px; 
            height: 340px;
            z-index: 5;
        }

        .house-base {
            width: 100%;
            height: 100%;
            position: absolute;
            bottom: 0;
            background-color: #a22c26;
            background-image: linear-gradient(0deg, rgba(0,0,0,0.15) 4px, transparent 4px);
            background-size: 100% 30px;
            border: 5px solid #5a1512;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            box-sizing: border-box;
            border-radius: 4px;
        }

        .house-roof {
            width: 0;
            height: 0;
            position: absolute;
            top: -95px;
            left: -5px;
            border-left: 250px solid transparent;
            border-right: 250px solid transparent;
            border-bottom: 95px solid #b83d35; 
        }

        .house-door {
            position: absolute;
            bottom: 0;
            left: 80px;
            width: 70px;
            height: 120px;
            background: #fbc531;
            border: 4px solid #5a1512;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            box-shadow: 0 0 20px rgba(251, 197, 49, 0.5);
        }

        .house-window {
            position: absolute;
            top: 100px;
            right: 80px;
            width: 90px;
            height: 90px;
            background: #edf2f7;
            border: 4px solid #5a1512;
            display: flex;
            flex-wrap: wrap;
        }

        .window-pane {
            width: calc(50% - 2px);
            height: calc(50% - 2px);
            border: 1px solid #718096;
            background: #7ed6df;
        }

        /* Big Round Hedge Barrier */
        .big-hedge {
            position: absolute;
            left: 2850px;
            top: 2200px;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #27ae60 40%, #1e8449 80%, #145a32 100%);
            border-radius: 50%;
            border: 8px solid #0e3a20;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            z-index: 6;
        }

        /* ==========================================
           3. POOL WITH INDEPENDENT WALKABLE MATS
           ========================================== */
        .pool {
            position: absolute;
            left: 1400px;
            top: 2500px;
            width: 500px;
            height: 350px;
            background: radial-gradient(circle, #34e7f4 30%, #0fbcf9 100%);
            border: 12px solid #d1d8e0;
            border-radius: 16px;
            box-shadow: inset 0 12px 24px rgba(0,0,0,0.4);
            z-index: 2;
            box-sizing: border-box;
        }

        .pool-mat {
            position: absolute;
            width: 110px;
            height: 70px;
            background: repeating-linear-gradient(90deg, #ffca28, #ffca28 12px, #ffb300 12px, #ffb300 24px);
            border-radius: 6px;
            border: 3px solid #b78103;
            box-shadow: 0 6px 12px rgba(0,0,0,0.35);
            z-index: 3;
        }
        .mat1 { left: 40px; top: 130px; }
        .mat2 { left: 180px; top: 130px; }
        .mat3 { left: 320px; top: 130px; }

        /* Environmental Decor */
        .border-tree {
            position: absolute;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #1e4611 50%, #0f2707 100%);
            border-radius: 50%;
            z-index: 10;
        }

        .map-tree {
            position: absolute;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, #2d6619 40%, #193d0c 100%);
            border-radius: 50%;
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .mud-patch {
            position: absolute;
            background: #523610;
            border-radius: 40% 60% 50% 50% / 50% 40% 60% 50%;
            opacity: 0.9;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.5);
            z-index: 1;
        }

        .rock {
            position: absolute;
            background-color: #8395a7;
            border-radius: 18px;
            border: 4px solid #576574;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            z-index: 4;
        }

        /* ==========================================
           4. CHARACTER RENDERING LAYER
           ========================================== */
        .character {
            position: absolute;
            width: 120px;
            height: 120px;
            z-index: 20;
            display: block !important; /* Lock open */
            left: 1800px;
            top: 1900px;
        }

        .char-body {
            position: absolute;
            left: 35px;
            top: 35px;
            width: 50px;
            height: 50px;
            background-color: #eb2f06; 
            border-radius: 50%;
            border: 3px solid #b31600;
            z-index: 3;
        }

        .char-head {
            position: absolute;
            left: 20px;
            top: -15px;
            width: 60px;
            height: 60px;
            background-color: #f9d342;
            border-radius: 50%;
            border: 3px solid #b31600;
            z-index: 4;
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="main-map">
            <div class="house-container">
                <div class="house-roof"></div>
                <div class="house-base">
                    <div class="house-door"></div>
                    <div class="house-window">
                        <div class="window-pane"></div>
                        <div class="window-pane"></div>
                        <div class="window-pane"></div>
                        <div class="window-pane"></div>
                    </div>
                </div>
            </div>
            <div class="big-hedge"></div>
            <div class="pool">
                <div class="pool-mat mat1"></div>
                <div class="pool-mat mat2"></div>
                <div class="pool-mat mat3"></div>
            </div>
            <div class="character">
                <div class="char-body"></div>
                <div class="char-head"></div>
            </div>
        </div>
    </div>
</body>
</html>
