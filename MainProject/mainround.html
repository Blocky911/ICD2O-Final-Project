<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Royale - Scrollable Map</title>
    <link rel="stylesheet" href="mainround.css">
</head>
<body>

    <div id="UI-overlay">
        <h3>🏆 Tag Royale Map Preview</h3>
        <p>🎮 Use <b>WASD</b> or <b>Arrow Keys</b> to control the player!</p>
        <p>🖱️ <b>Click and drag</b> anywhere to manual-scroll the massive 5000x5000 map.</p>
    </div>

    <div id="viewport">
        <div id="main-map">
            
            <div class="mud-patch" style="left: 1200px; top: 1400px; width: 450px; height: 300px;"></div>
            <div class="mud-patch" style="left: 2600px; top: 2100px; width: 350px; height: 250px;"></div>
            <div class="mud-patch" style="left: 1800px; top: 3200px; width: 500px; height: 400px;"></div>

            <div class="pool">
                <div class="pool-mat mat1"></div>
                <div class="pool-mat mat2"></div>
                <div class="pool-mat mat3"></div>
            </div>

            <div class="house-container">
                <div class="house-roof"></div>
                <div class="house-base"></div>
            </div>

            <div class="rock" style="left: 1000px; top: 1800px; width: 130px; height: 110px;"></div>
            <div class="rock" style="left: 2800px; top: 2600px; width: 180px; height: 140px;"></div>
            <div class="rock" style="left: 2100px; top: 1600px; width: 100px; height: 90px;"></div>
            <div class="rock" style="left: 1400px; top: 2900px; width: 150px; height: 130px;"></div>

            <div class="character">
                <div class="char-head"></div>
                <div class="char-body"></div>
                <div class="sleeve-l1"></div>
                <div class="hand-l2"></div>
                <div class="sleeve-r1"></div>
                <div class="hand-r2"></div>
                <div class="leg-l"></div>
                <div class="leg-r"></div>
            </div>

            <div id="tree-container"></div>

        </div>
    </div>

    <script src="mainround.js"></script>
</body>
</html>
